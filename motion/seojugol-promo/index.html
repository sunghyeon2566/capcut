<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서주골 — 항아리 장작구이</title>
<style>
  @font-face { font-family: 'Pre'; src: url(fonts/Pretendard-Medium.otf); font-weight: 500; }
  @font-face { font-family: 'Pre'; src: url(fonts/Pretendard-SemiBold.otf); font-weight: 600; }
  @font-face { font-family: 'Pre'; src: url(fonts/Pretendard-Bold.otf); font-weight: 700; }
  @font-face { font-family: 'Pre'; src: url(fonts/Pretendard-ExtraBold.otf); font-weight: 800; }
  @font-face { font-family: 'Mono'; src: url(fonts/JetBrainsMono-Regular.ttf); font-weight: 400; }
  html, body { margin: 0; height: 100%; background: #000; color: #aaa; font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #c { display: block; max-width: 100vw; max-height: calc(100vh - 56px); background: #000; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100vw, 960px); padding: 0 12px; box-sizing: border-box; }
  .bar button { background: #111; color: #eee; border: 1px solid #555; padding: 6px 12px; cursor: pointer; }
  .bar input { flex: 1; }
  body.render { display: block; }
  body.render #c { max-width: none; max-height: none; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button id="play">재생</button>
  <input id="seek" type="range" min="0" max="1" step="0.001" value="0">
  <span id="time">0.00s</span>
</div>
<audio id="snd" src="out/sound.wav" preload="auto"></audio>
<script>
/* ============================================================
   서주골 홍보 모션 — 레퍼런스(앱 런칭 필름)의 문법:
   어두운 조명 배경 + 휴대폰 화면 + 튀어나오는 카드 + 블러로 맺히는 굵은 제목(끝 단어 강조색)
   + 작은 모노 머리말. 음식·화덕은 매장 실사 사진(assets/), 룸 복도와 마크는 직접 그린 그림.
   모든 프레임은 시간 t 만으로 결정된다 (Math.random / Date 금지).
   ============================================================ */

/* ---------- 1. 설정 ---------- */
const W = 1920, H = 1080, FPS = 30, DUR = 49.5;
const BPM = 120, BEAT = 60 / BPM;
const T = {
  hook:    [0, 3.0],     // 항아리에 걸어 굽습니다 → 휴대폰 등장
  fire:    [3.0, 5.5],   // 화면 속 항아리로 들어가기, 굽는 중
  hang:    [5.5, 8.5],   // 360° 골고루 + 카드
  tilt:    [8.5, 11.0],  // 기울어진 화면(갈비 사진): 겉은 윤기, 속은 촉촉 + 느낌 카드
  menu:    [11.0, 13.5], // 갈비도, 삼겹살도 (불 위 화로 사진)
  sides:   [13.5, 19.0], // 메뉴 목록 → 찌개 사진 + 반찬 카드
  gather:  [19.0, 24.0], // (청록) 여럿이 함께, 편하게
  reserve: [24.0, 28.0], // 예약하고 바로 입장
  reviews: [28.0, 36.0], // (보라) 리뷰 타자 + 카드
  montage: [36.0, 41.5], // 화면 다섯 개 + 한 상
  logo:    [41.5, DUR],  // 서주골 + 예약 특별 서비스 + 안내
};

const C = {
  bg: '#0b0806',
  ember: '#4a230f',
  teal: '#0e3b44',
  plum: '#2b1a4a',
  acc: '#FFB648',     // 윤기 나는 갈비 빛
  acc2: '#FF7A2F',    // 숯불 주황
  fg: '#F7F3EE',
  muted: 'rgba(247,243,238,0.58)',
  ui: '#ffffff', uiInk: '#16120f', uiMuted: '#8b847d', uiChip: '#f4eee7', uiBtn: '#E8772E',
};

// 화면 문구 — 사용자가 준 자료(사진, 리뷰 2건, 매장 정보)와 요청 문구에서만
const COPY = {
  brand: '서주골',
  tag: 'CHUNCHEON · HANGARI GRILL',
  offer1: '예약을 하시고 오시는 분들께는',
  offer2: [['특별한 서비스', C.acc], [' 또한 제공해 드리겠습니다', C.fg]],
  addr: '강원 춘천시 동면 소양강로 182 1층 · 강변스크린 옆 건물',
  tel: '033-253-6666',
  insta: '@seojugol_official',
  brk: '15:00 브레이크타임',
  review1a: '“음식들이 모두 다',
  review1b: '맛있어요~”',
  review1full: '음식들이 모두 다 맛있어요~ 사장님께서도 너무 친절하시고 너무 기분좋고 맛있게 잘 먹었습니다.',
  review2: '고기도 맛있고 든든하게 식사하기 좋았습니다. 여럿이서 함께 식사하기에도 괜찮아서 가족 모임 장소로도 좋을 것 같아요.',
};

/* ---------- 2. 수학 ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sstep = (a, b, v) => { const k = clamp((v - a) / (b - a)); return k * k * (3 - 2 * k); };
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eOutExpo = k => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
const eInCubic = k => k * k * k;
const eInOutCubic = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const eInOutQuint = k => (k < 0.5 ? 16 * k ** 5 : 1 - Math.pow(-2 * k + 2, 5) / 2);
const eOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const inT = (t, k) => t >= T[k][0] && t < T[k][1];

const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* ---------- 3. 글자 ---------- */
function setFont(g, o) {
  g.font = `${o.weight ?? 800} ${o.size ?? 60}px ${o.fam ?? 'Pre'}`;
  g.textAlign = o.align ?? 'left';
  g.textBaseline = 'alphabetic';
  g.letterSpacing = (o.ls ?? 0) + 'px';
}
function text(s, x, y, o = {}, g = ctx) {
  g.save(); setFont(g, o);
  g.globalAlpha *= o.alpha ?? 1;
  if (o.shadow) { g.shadowColor = o.shadow; g.shadowBlur = o.shadowBlur ?? 20; }
  g.fillStyle = o.color ?? C.fg;
  g.fillText(s, x, y);
  g.restore();
}
function measure(s, o, g = ctx) { g.save(); setFont(g, o); const w = g.measureText(s).width; g.restore(); return w; }
const HEAD = { weight: 800, size: 96, ls: -2.5 };   // 큰 제목 (레퍼런스의 굵은 그로테스크)

/* 블러에서 맺히는 제목. lines: [[[글자, 색], ...], ...]  (어절 단위로 차례로)
   k0: 등장 시작(장면 시간), out: 사라지기 시작 시각(없으면 안 사라짐) */
function blurHead(lines, x, y, lt, k0, o = {}) {
  const st = { ...HEAD, ...o };
  const lh = st.size * (o.lh ?? 1.1);
  const outK = o.out != null ? sstep(o.out, o.out + 0.35, lt) : 0;
  let idx = 0;
  lines.forEach((segs, li) => {
    const words = [];
    segs.forEach(([s, col]) => s.split(/(?<= )/).forEach(w => w && words.push([w, col])));
    const total = words.reduce((a, [w]) => a + measure(w, st), 0);
    let cx = st.align === 'center' ? x - total / 2 : st.align === 'right' ? x - total : x;
    words.forEach(([w, col]) => {
      const k = eOutCubic(prog(lt, k0 + idx * 0.07, k0 + idx * 0.07 + 0.55));
      idx++;
      const ww = measure(w, st);
      const a = k * (1 - outK);
      if (a > 0.01) {
        ctx.save();
        const b = (1 - k) * 18 + outK * 14;
        if (b > 0.4) ctx.filter = `blur(${b.toFixed(1)}px)`;
        ctx.globalAlpha = a;
        text(w, cx + (1 - k) * 18, y + li * lh, { ...st, align: 'left', color: col });
        ctx.restore();
      }
      cx += ww;
    });
  });
}
// ● MONO LABEL
function eyebrow(label, x, y, lt, k0, out, color = C.acc) {
  const k = prog(lt, k0, k0 + 0.4) * (out != null ? 1 - prog(lt, out, out + 0.3) : 1);
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k;
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x + 5, y - 6, 4.5, 0, TAU); ctx.fill();
  const shown = label.slice(0, Math.ceil(label.length * clamp(prog(lt, k0, k0 + 0.5) * 1.2)));
  text(shown, x + 20, y, { fam: 'Mono', weight: 400, size: 17, ls: 5, color: 'rgba(247,243,238,0.72)' });
  ctx.restore();
}
function subline(s, x, y, lt, k0, out, o = {}) {
  const k = prog(lt, k0, k0 + 0.5) * (out != null ? 1 - prog(lt, out, out + 0.3) : 1);
  if (k <= 0) return;
  text(s, x, y, { weight: 500, size: 27, ls: -0.3, color: C.muted, alpha: eOutCubic(k), ...o });
}

/* ---------- 4. 배경: 장면마다 빛 색이 바뀌는 비네트 ---------- */
function glowColorAt(t) {
  // 청록(모임) · 보라(리뷰) 장면만 색이 바뀐다
  const toTeal = sstep(T.gather[0] - 0.4, T.gather[0] + 0.2, t) * (1 - sstep(T.reserve[0] - 0.3, T.reserve[0] + 0.2, t));
  const toPlum = sstep(T.reviews[0] - 0.4, T.reviews[0] + 0.3, t) * (1 - sstep(T.montage[0] - 0.4, T.montage[0] + 0.3, t));
  const mixc = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return A.map((v, i) => Math.round(lerp(v, B[i], k))); };
  let c = mixc(C.ember, C.teal, toTeal);
  if (toPlum > 0) { const p = mixc(C.ember, C.plum, toPlum); c = c.map((v, i) => Math.round(lerp(v, p[i], toPlum))); }
  return c;
}
function background(t, gx = W * 0.62, gy = H * 0.42, strength = 1) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const [r, g, b] = glowColorAt(t);
  const R = 1250;
  const gr = ctx.createRadialGradient(gx, gy, 0, gx, gy, R);
  gr.addColorStop(0, `rgba(${r},${g},${b},${0.95 * strength})`);
  gr.addColorStop(0.45, `rgba(${r},${g},${b},${0.42 * strength})`);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  // 아래쪽 은은한 숯불 빛
  const g2 = ctx.createLinearGradient(0, H, 0, H * 0.55);
  g2.addColorStop(0, `rgba(${Math.min(255, r + 40)},${g},${Math.max(0, b - 10)},0.16)`); g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
}
let NOISE;
function buildNoise() {
  NOISE = mk(256, 256);
  const g = NOISE.getContext('2d'), img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) { const v = hash(i * 0.41 + 2.7) * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
}
function grain(t, alpha = 0.045) {
  const f = Math.floor(t * FPS / 2);
  ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'overlay';
  const ox = -Math.floor(hash(f) * 256), oy = -Math.floor(hash(f + 0.5) * 256);
  for (let y = oy; y < H; y += 256) for (let x = ox; x < W; x += 256) ctx.drawImage(NOISE, x, y);
  ctx.restore();
}
function vignette(s = 0.5) {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, W * 0.66);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${s})`);
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

/* ============================================================
   5. 일러스트 — 사진 대신 직접 그린 그림 (부팅 때 한 번 그려 둔다)
   ============================================================ */
const CACHE = {};
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function lin(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
function rad(g, x, y, r0, r1, stops, x1 = x, y1 = y) { const gr = g.createRadialGradient(x, y, r0, x1, y1, r1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }

// 나무 식탁
function table(g, w, h, seed = 1) {
  g.fillStyle = lin(g, 0, 0, 0, h, [[0, '#3a2516'], [1, '#22150c']]); g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) {
    const y = hash(seed + i * 3.3) * h, a = 0.05 + hash(i * 1.7 + seed) * 0.08;
    g.strokeStyle = `rgba(0,0,0,${a})`; g.lineWidth = 1 + hash(i) * 2;
    g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= w; x += 40) g.lineTo(x, y + Math.sin(x / 90 + i) * 4);
    g.stroke();
  }
  g.fillStyle = rad(g, w * 0.5, h * 0.45, 0, Math.max(w, h) * 0.7, [[0, 'rgba(255,170,90,0.10)'], [1, 'rgba(0,0,0,0.35)']]); g.fillRect(0, 0, w, h);
}
// 쪼갠 장작 더미 (단면 + 껍질)
function logs(g, x0, y0, w, h, seed) {
  g.fillStyle = '#1e120b'; g.fillRect(x0, y0, w, h);
  const cols = 9, rows = 6, cw = w / cols, rh = h / rows;
  for (let row = 0; row < rows; row++) for (let i = 0; i < cols + 1; i++) {
    const s2 = seed + row * 17 + i, cx = x0 + i * cw + (row % 2) * cw * 0.5 + (hash(s2) - 0.5) * cw * 0.2, cy = y0 + row * rh + rh * 0.5 + (hash(s2 + 1) - 0.5) * rh * 0.2;
    const R = Math.min(cw, rh) * (0.5 + hash(s2 + 2) * 0.12);
    // 부채꼴로 쪼갠 단면
    const a0 = hash(s2 + 3) * TAU, span = TAU * (0.28 + hash(s2 + 4) * 0.22);
    g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, a0, a0 + span); g.closePath();
    g.fillStyle = rad(g, cx, cy, 0, R, [[0, '#c79c66'], [0.8, '#a77a4a'], [1, '#6b4526']]); g.fill();
    g.strokeStyle = '#3a2213'; g.lineWidth = 5; g.beginPath(); g.arc(cx, cy, R, a0, a0 + span); g.stroke();
    g.strokeStyle = 'rgba(90,55,25,0.45)'; g.lineWidth = 1.5;
    for (let k = 1; k < 4; k++) { g.beginPath(); g.arc(cx, cy, R * k / 4, a0 + 0.05, a0 + span - 0.05); g.stroke(); }
  }
}
// 갈비 한 토막 (윤기 나는 양념 겉면 + 분홍 단면 + 뼈 끝)
function rib(g, L, Wd, seed, opt = {}) {
  const r = Wd * 0.14, face = opt.face === false ? 0 : Wd * 0.3;   // face: 앞쪽 단면 두께
  // 그림자 몸통
  rr(g, -L / 2, -Wd / 2, L, Wd, r); g.fillStyle = '#3a1406'; g.fill();
  // 겉면(위)
  rr(g, -L / 2, -Wd / 2, L, Wd - face, r);
  g.fillStyle = lin(g, 0, -Wd / 2, 0, Wd / 2 - face, [[0, '#d9772a'], [0.3, '#b8561a'], [0.75, '#8a330c'], [1, '#5e1f06']]); g.fill();
  // 뼈 사이 골 (길이 방향)
  g.lineCap = 'round';
  for (let i = 1; i < 3; i++) {
    const y = -Wd / 2 + (Wd - face) * i / 3;
    g.strokeStyle = 'rgba(60,18,4,0.55)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-L * 0.46, y); g.bezierCurveTo(-L * 0.15, y + 3, L * 0.15, y - 3, L * 0.46, y); g.stroke();
  }
  // 앞 단면 (분홍 살 + 흰 지방 줄 + 바삭한 가장자리)
  if (face > 0) {
  rr(g, -L / 2, Wd / 2 - face, L, face, [0, 0, r, r]);
  g.fillStyle = lin(g, 0, Wd / 2 - face, 0, Wd / 2, [[0, '#e8c3b2'], [0.55, '#d5a08c'], [1, '#a9705c']]); g.fill();
  g.strokeStyle = 'rgba(255,245,235,0.7)'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(-L * 0.47, Wd / 2 - face * 0.45); g.bezierCurveTo(-L * 0.2, Wd / 2 - face * 0.55, L * 0.2, Wd / 2 - face * 0.35, L * 0.47, Wd / 2 - face * 0.5); g.stroke();
  g.fillStyle = 'rgba(110,40,10,0.85)'; g.fillRect(-L / 2, Wd / 2 - face - 2, L, 4);
  }
  // 숯 자국 · 그을린 끝
  for (let i = 0; i < 9; i++) {
    const px = (hash(seed + i) - 0.5) * L * 0.95, py = -Wd / 2 + hash(seed + i + 9) * (Wd - face);
    const pr = Wd * (0.04 + hash(seed + i * 2) * 0.1);
    g.fillStyle = rad(g, px, py, 0, pr, [[0, 'rgba(30,8,2,0.8)'], [1, 'rgba(30,8,2,0)']]); g.fillRect(px - pr, py - pr, pr * 2, pr * 2);
  }
  [-1, 1].forEach(sd => { const ex = sd * L / 2; g.fillStyle = rad(g, ex, 0, 0, Wd * 0.75, [[0, 'rgba(28,8,2,0.9)'], [1, 'rgba(28,8,2,0)']]); g.fillRect(ex - Wd, -Wd, Wd * 2, Wd * 2); });
  // 윤기 (길게 빛나는 줄)
  for (let i = 0; i < 6; i++) {
    const y = -Wd / 2 + (Wd - face) * (0.12 + i * 0.13), a = 0.25 + hash(seed + i * 7) * 0.4;
    g.strokeStyle = `rgba(255,226,170,${a})`; g.lineWidth = 1.2 + hash(seed + i) * 2;
    const x0 = -L * 0.38 + hash(seed + i * 3) * L * 0.2, x1 = L * 0.38 - hash(seed + i * 5) * L * 0.25;
    g.beginPath(); g.moveTo(x0, y); g.bezierCurveTo(x0 + (x1 - x0) * 0.3, y - 3, x0 + (x1 - x0) * 0.7, y + 3, x1, y); g.stroke();
  }
  g.fillStyle = lin(g, 0, -Wd / 2, 0, -Wd / 2 + 10, [[0, 'rgba(255,220,160,0.35)'], [1, 'rgba(255,220,160,0)']]); rr(g, -L / 2 + r, -Wd / 2, L - 2 * r, 10, 4); g.fill();
  // 뼈 끝
  if (opt.bone !== false) for (let i = 0; i < 2; i++) {
    const y = -Wd / 2 + (Wd - face) * (0.3 + i * 0.4);
    g.fillStyle = lin(g, 0, y - 6, 0, y + 6, [[0, '#f7ecd6'], [1, '#c9b38e']]);
    g.beginPath(); g.ellipse(L / 2 + 4, y, Wd * 0.09, Wd * 0.07, 0, 0, TAU); g.fill();
  }
}
// 항아리 화덕 장면 (세로 화면용 750×1300)
function drawJarScene(g, w, h) {
  // 벽돌 벽 + 장작 더미
  g.fillStyle = lin(g, 0, 0, 0, h, [[0, '#5b3423'], [0.55, '#3e2216'], [1, '#2a1810']]); g.fillRect(0, 0, w, h);
  for (let r = 0; r < 18; r++) for (let c = 0; c < 9; c++) {

function loadImage(src) { return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
async function loadPhotos() {

// 움직이는 겹: 연기·불티·김
function smoke(g, x, y, w, h, t, n = 5, alpha = 0.22) {
  g.save(); g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const ph = (t * 0.25 + hash(i * 3.7)) % 1;
    const sx = x + w * (0.3 + hash(i) * 0.4), sy = y + h * (1 - ph) ;
    g.strokeStyle = `rgba(235,225,215,${alpha * Math.sin(ph * Math.PI)})`; g.lineWidth = w * 0.06 * (0.5 + ph);
    g.filter = `blur(${(w * 0.02).toFixed(1)}px)`;
    g.beginPath(); g.moveTo(sx, sy);
    for (let k = 1; k <= 6; k++) g.lineTo(sx + Math.sin(k * 0.9 + t * 1.3 + i) * w * 0.06 * k * 0.4, sy - k * h * 0.06);
    g.stroke();
  }
  g.filter = 'none'; g.restore();
}
function embers(g, x, y, w, h, t, n = 26) {
  g.save();
  for (let i = 0; i < n; i++) {
    const ph = (t * (0.35 + hash(i) * 0.3) + hash(i * 5.1)) % 1;
    const px = x + w * (0.25 + hash(i * 2.2) * 0.5) + Math.sin(t * 2 + i) * w * 0.03, py = y + h * (1 - ph);
    g.fillStyle = `rgba(255,${140 + Math.floor(hash(i) * 80)},60,${Math.sin(ph * Math.PI) * 0.9})`;
    g.beginPath(); g.arc(px, py, (1.5 + hash(i * 3) * 2.5) * (w / 400), 0, TAU); g.fill();
  }
  g.restore();
}
function steam(g, x, y, w, h, t) { smoke(g, x, y, w, h, t * 1.4, 4, 0.18); }
function bubbles(g, cx, cy, rx, ry, t) {
  for (let i = 0; i < 14; i++) {
    const ph = (t * 1.2 + hash(i * 2.3)) % 1;
    const x = cx + (hash(i * 5.5) - 0.5) * rx * 1.4, y = cy + (hash(i * 7.1) - 0.5) * ry * 1.3;
    const r = rx * 0.03 * Math.sin(ph * Math.PI);
    g.strokeStyle = `rgba(255,220,170,${0.5 * Math.sin(ph * Math.PI)})`; g.lineWidth = 2;
    g.beginPath(); g.arc(x, y, Math.max(0.1, r), 0, TAU); g.stroke();
  }
}

function chip(g, x, y, label, on = false) {
  const w = measure(label, { weight: 600, size: 13 }, g) + 24;
  rr(g, x, y, w, 28, 14); g.fillStyle = on ? '#fde9d6' : C.uiChip; g.fill();

function lines(g, x, y, w, n, gap = 16, col = '#e9e4de') { g.fillStyle = col; for (let i = 0; i < n; i++) { rr(g, x, y + i * gap, w * (i === n - 1 ? 0.6 : 1 - hash(i + x) * 0.15), 7, 3.5); g.fill(); } }
function cover(g, img, x, y, w, h, zoom = 1, px, py) {
  px = px ?? img.fx ?? 0.5; py = py ?? img.fy ?? 0.5;
  const s = Math.max(w / img.width, h / img.height) * zoom, dw = img.width * s, dh = img.height * s;
  g.drawImage(img, x + (w - dw) * px, y + (h - dh) * py, dw, dh);
}

/* ---------- 7. 휴대폰 본체 ---------- */
const PW = 430, PH = 880, PR = 1.5;   // 화면 밖 캔버스 해상도 배율
const PHONE = mk(Math.round(PW * PR), Math.round(PH * PR));
const PC = PHONE.getContext('2d');
function renderPhone(screenFn, t) {
  const g = PC;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, PHONE.width, PHONE.height);
  g.scale(PR, PR);
  // 옆 버튼
  g.fillStyle = '#3a3836'; rr(g, -3, 190, 6, 60, 3); g.fill(); rr(g, -3, 270, 6, 90, 3); g.fill(); rr(g, PW - 3, 250, 6, 110, 3); g.fill();
  // 테두리(티타늄)
  rr(g, 0, 0, PW, PH, 68); g.fillStyle = lin(g, 0, 0, PW, PH, [[0, '#6d6a66'], [0.5, '#2c2a28'], [1, '#55524e']]); g.fill();
  rr(g, 5, 5, PW - 10, PH - 10, 63); g.fillStyle = '#050505'; g.fill();
  // 화면
  const sx = (PW - SW) / 2, sy = (PH - SH) / 2;
  g.save(); rr(g, sx, sy, SW, SH, 52); g.clip(); g.translate(sx, sy);
  screenFn(g, t);
  island(g);
  g.restore();
  // 유리 반사
  g.save(); rr(g, sx, sy, SW, SH, 52); g.clip();
  g.fillStyle = lin(g, 0, 0, PW, PH * 0.6, [[0, 'rgba(255,255,255,0.10)'], [0.45, 'rgba(255,255,255,0.02)'], [0.46, 'rgba(255,255,255,0)'], [1, 'rgba(255,255,255,0)']]);
  g.fillRect(0, 0, PW, PH); g.restore();
}
/* 휴대폰을 장면에 놓는다. o: { s 크기, rot 기울기(-1..1), vx 이동 속도(px/프레임, 흐림용), alpha, shadow } */
function phone(cx, cy, screenFn, t, o = {}) {
  renderPhone(screenFn, t);
  const s = (o.s ?? 1) / PR, rot = o.rot ?? 0;
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.translate(cx, cy);
  // 회전(3D 느낌): 가로로 눌리고 한쪽이 위로 기운다
  ctx.transform(1 - Math.abs(rot) * 0.28, rot * 0.16, rot * -0.05, 1, 0, 0);
  ctx.rotate(o.tilt ?? 0);
  ctx.scale(s, s);
  // 그림자
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 80; ctx.shadowOffsetY = 40;
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.roundRect(-PHONE.width / 2 + 20, -PHONE.height / 2 + 20, PHONE.width - 40, PHONE.height - 40, 90); ctx.fill(); ctx.restore();
  const v = o.vx ?? 0, vy = o.vy ?? 0;
  if (Math.abs(v) + Math.abs(vy) > 2) {   // 움직임 흐림: 진행 방향으로 여러 장
    const n = 8;
    for (let i = 0; i < n; i++) { ctx.globalAlpha = (o.alpha ?? 1) * (i === n - 1 ? 1 : 0.22); ctx.drawImage(PHONE, -PHONE.width / 2 - (v * (n - 1 - i) / n) / s, -PHONE.height / 2 - (vy * (n - 1 - i) / n) / s); }
  } else ctx.drawImage(PHONE, -PHONE.width / 2, -PHONE.height / 2);
  ctx.restore();
}
// 떠 있는 카드 (흰 둥근 상자)
function card(x, y, w, h, k, fn, o = {}) {
  if (k <= 0) return;
  ctx.save();
  ctx.globalAlpha *= clamp(k * 2) * (o.alpha ?? 1);
  const s = 0.7 + 0.3 * eOutBack(clamp(k));
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s); ctx.rotate(o.rot ?? 0);
  if (k < 0.6) ctx.filter = `blur(${((0.6 - k) * 20).toFixed(1)}px)`;
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 24;
  ctx.fillStyle = o.fill ?? '#fff'; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, o.r ?? 26); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, o.r ?? 26); ctx.clip();
  ctx.translate(-w / 2, -h / 2);
  fn(ctx, w, h);
  ctx.restore();
}

    (g, tt) => scrMenu(g, tt),

    (g, tt) => scrDish(g, tt, CACHE.stew, '김치찌개', '고기와 함께 든든하게', ['보글보글', '두부', '김치'], '함께 주문하기', { steam: true }),
    (g, tt) => scrReserve(g, tt, 1),
  ];
  const out = eInCubic(prog(lt, d - 0.6, d));
  screens.forEach((fn, i) => {
    const off = i - 2, kk = eOutExpo(prog(lt, 0.1 + Math.abs(off) * 0.12, 0.8 + Math.abs(off) * 0.12));
    const x = W / 2 + off * 330 * lerp(0.6, 1, kk), y = H * 0.6 + (1 - kk) * 500 + Math.abs(off) * 14 + out * 700;
    phone(x, y, fn, t, { s: i === 2 ? 0.68 : 0.6, rot: -off * 0.32, alpha: clamp(kk * 2) });
  });
  const swap = 3.4;
  ctx.save(); ctx.globalAlpha = 1 - out;
  if (lt < swap + 0.2) blurHead([[['장작. ', C.fg], ['항아리. ', C.fg], ['한 상.', C.acc]]], W / 2, 190, lt, 0.4, { size: 70, align: 'center', out: swap - 0.3 });
  if (lt > swap - 0.1) blurHead([[['춘천 ', C.fg], ['서주골.', C.acc]]], W / 2, 190, lt, swap, { size: 70, align: 'center' });
  ctx.restore();
}
// ⑪ 서주골 + 예약 특별 서비스 + 안내
function jarMark(x, y, s, k) {   // 직접 그린 항아리 마크 (공식 로고 아님)
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const wipe = eOutCubic(k);
  ctx.beginPath(); ctx.rect(-80, 80 - 170 * wipe, 160, 170 * wipe + 2); ctx.clip();
  ctx.fillStyle = lin(ctx, -60, 0, 60, 0, [[0, '#ffcf7a'], [1, '#ff8a2a']]);
  ctx.beginPath(); ctx.moveTo(-30, -34); ctx.bezierCurveTo(-78, -22, -80, 40, -34, 70); ctx.lineTo(34, 70); ctx.bezierCurveTo(80, 40, 78, -22, 30, -34); ctx.closePath(); ctx.fill();
  ctx.fillRect(-26, 66, 52, 10);
  ctx.beginPath(); ctx.ellipse(0, -38, 38, 11, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1a0f08'; ctx.beginPath(); ctx.ellipse(0, -38, 29, 7, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.beginPath(); ctx.ellipse(-30, 2, 9, 24, 0.25, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#ffcf7a'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  [-18, 0, 18].forEach((dx, i) => { ctx.beginPath(); ctx.moveTo(dx, -56); ctx.bezierCurveTo(dx - 10, -70, dx + 10, -78, dx, -92 + i % 2 * 6); ctx.stroke(); });
  ctx.restore();
}
function sLogo(lt, t, d) {
  background(t, W / 2, H * 0.42, 0.85);
  ctx.save(); ctx.globalAlpha = 0.3 * sstep(0, 1.2, lt); ctx.filter = 'blur(16px) brightness(0.5) saturate(1.15)';
  cover(ctx, CACHE.ribs, -40, -40, W + 80, H + 80, 1.05 + 0.01 * lt); ctx.restore();
  const vg = ctx.createRadialGradient(W / 2, H * 0.5, 100, W / 2, H * 0.5, W * 0.6); vg.addColorStop(0, 'rgba(11,8,6,0.55)'); vg.addColorStop(1, 'rgba(11,8,6,0.85)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const k = prog(lt, 0.2, 1.0);
  const up = eInOutCubic(prog(lt, 2.4, 3.1));   // 안내가 나오면 위로 올라간다
  const cy = lerp(H * 0.47, H * 0.3, up);
  const wo = { weight: 800, size: 150, ls: -4 };
  const tw = measure(COPY.brand, wo), total = 150 + 26 + tw, x0 = W / 2 - total / 2;
  jarMark(x0 + 70, cy - 52, 1.05, k);
  const wk = eOutCubic(prog(lt, 0.5, 1.2));
  ctx.save(); ctx.beginPath(); ctx.rect(x0 + 150, cy - 170, (tw + 40) * wk, 260); ctx.clip();
  text(COPY.brand, x0 + 176 - (1 - wk) * 40, cy, { ...wo, color: C.fg });
  ctx.restore();
  const tk = prog(lt, 1.1, 1.6);
  text(COPY.tag, W / 2, cy + 74, { fam: 'Mono', weight: 400, size: 22, ls: 9, align: 'center', color: C.acc, alpha: tk * (1 - up * 0.2) });
  // 예약 특별 서비스
  const ok = prog(lt, 2.9, 3.4);
  if (ok > 0) {
    const y = H * 0.55;
    blurHead([[[COPY.offer1, C.fg]]], W / 2, y, lt, 2.9, { size: 46, align: 'center', weight: 700 });
    blurHead([COPY.offer2], W / 2, y + 72, lt, 3.15, { size: 62, align: 'center' });
    const ul = eOutCubic(prog(lt, 3.6, 4.1));
    const w1 = measure(COPY.offer2[0][0], { ...HEAD, size: 62 }), wAll = measure(COPY.offer2.map(s => s[0]).join(''), { ...HEAD, size: 62 });
    ctx.fillStyle = C.acc; ctx.fillRect(W / 2 - wAll / 2, y + 90, w1 * ul, 5);
  }
  // 안내
  const ik = prog(lt, 4.2, 4.8);
  if (ik > 0) {
    ctx.save(); ctx.globalAlpha = eOutCubic(ik);
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fillRect(W / 2 - 520, H * 0.735, 1040, 1.5);
    text(COPY.addr, W / 2, H * 0.735 + 62, { weight: 600, size: 30, align: 'center', color: C.fg });
    const line2 = `☎ ${COPY.tel}   ·   ${COPY.insta}   ·   ${COPY.brk}`;
    text(line2, W / 2, H * 0.735 + 114, { weight: 500, size: 26, align: 'center', color: 'rgba(247,243,238,0.7)' });
    ctx.restore();
  }
  // 끝 페이드
  const end = sstep(d - 0.6, d, lt);
  if (end > 0) { ctx.fillStyle = `rgba(0,0,0,${end * 0.85})`; ctx.fillRect(0, 0, W, H); }
}

const SCENES = [
  [T.hook, sHook], [T.fire, sFire], [T.hang, sHang], [T.tilt, sTilt], [T.menu, sMenu], [T.sides, sSides],
  [T.gather, sGather], [T.reserve, sReserve], [T.reviews, sReviews], [T.montage, sMontage], [T.logo, sLogo],
];

/* ---------- 9. 전환 ---------- */
// 밝은 빛줄기가 훑고 지나간다 (모임 장면 들어갈 때)
function lightSweep(t, at) {
  const k = prog(t, at - 0.35, at + 0.35);
  if (k <= 0 || k >= 1) return;
  const x = lerp(W * 1.1, -W * 0.1, eInOutCubic(k));
  const a = Math.sin(k * Math.PI);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(x - 260, 0, x + 260, 0);
  g.addColorStop(0, 'rgba(150,230,240,0)'); g.addColorStop(0.5, `rgba(200,245,250,${0.85 * a})`); g.addColorStop(1, 'rgba(150,230,240,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
// 하얗게 번지는 섬광 (리뷰 장면 들어갈 때)
function whiteBloom(t, at) {
  const a = 1 - clamp(Math.abs(t - at) / 0.3);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = eOutCubic(a) * 0.92; ctx.fillStyle = '#f4f1ff'; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function whip(t, at) {   // 짧은 가로 흐림 (휙)
  const a = 1 - clamp(Math.abs(t - at) / 0.12);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = 0.35 * a; ctx.filter = `blur(${(14 * a).toFixed(1)}px)`; ctx.drawImage(cv, 40 * a, 0); ctx.restore();
}

/* ---------- 10. 한 프레임 ---------- */
function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  for (const [[a, b], fn] of SCENES) if (t >= a && t < b) { fn(t - a, t, b - a); break; }
  [T.hang[0], T.tilt[0], T.menu[0], T.sides[0], T.reserve[0], T.montage[0]].forEach(at => whip(t, at));
  lightSweep(t, T.gather[0]);
  whiteBloom(t, T.reviews[0]);
  // 처음 검은 화면에서 밝아짐
  if (t < 0.5) { ctx.fillStyle = `rgba(0,0,0,${1 - t / 0.5})`; ctx.fillRect(0, 0, W, H); }
  vignette(0.5);
  grain(t, 0.04);
}

/* ---------- 11. 재생 / 렌더 훅 ---------- */
const params = new URLSearchParams(location.search);
const RENDER = params.has('render');
if (RENDER) document.body.classList.add('render');
else cv.style.aspectRatio = `${W} / ${H}`;
window.DURATION = DUR;
window.FPS = FPS;
window.renderFrame = t => render(t);
window.captureFrame = t => { render(t); return cv.toDataURL('image/png'); };

async function boot() {
  await Promise.all(['500', '600', '700', '800'].map(w => document.fonts.load(`${w} 40px Pre`, '가A')).concat([document.fonts.load('400 40px Mono', 'A')]));
  buildNoise();
  buildCaches();
  await loadPhotos();
  window.sceneReady = true;
  if (RENDER) { render(Number(params.get('t') || 0)); return; }
  const snd = document.getElementById('snd'), seek = document.getElementById('seek'), btn = document.getElementById('play'), lab = document.getElementById('time');
  seek.max = DUR;
  let playing = false, tAt = Number(params.get('t') || 0), t0 = performance.now();
  render(tAt);
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? '일시정지' : '재생'; t0 = performance.now(); if (playing) { snd.currentTime = tAt; snd.play().catch(() => {}); } else snd.pause(); };
  seek.oninput = () => { tAt = Number(seek.value); snd.currentTime = tAt; render(tAt); lab.textContent = tAt.toFixed(2) + 's'; };
  (function loop(now) {
    if (playing) { tAt = snd.duration && !snd.paused ? snd.currentTime : tAt + (now - t0) / 1000; if (tAt >= DUR) { tAt = 0; snd.currentTime = 0; } render(tAt); seek.value = tAt; lab.textContent = tAt.toFixed(2) + 's'; }
    t0 = now; requestAnimationFrame(loop);
  })(performance.now());
}
boot();
</script>
