<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새로운 책쓰기 연구소 · 홍보 모션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@500;700&family=Noto+Serif+KR:wght@400;600;700;900&display=block">
<style>
/* ============================================================
   새로운 책쓰기 연구소 (KYT) — 9:16 홍보 모션그래픽
   1080 x 1920 · 30fps · 32.5초
   문구는 아래 <script> 의 COPY 객체에서 바꿉니다.
   ============================================================ */
:root{
  --serif:'Noto Serif KR',serif;
  --sans:'Noto Sans KR',sans-serif;
  --mono:'JetBrains Mono','Nanum Gothic Coding',monospace;
  --hand:'Nanum Pen Script',cursive;
  --cream:#fbf6ec;
  --ink:#2a2118;
  --red:#c4452f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050403}
body{overflow:hidden;color:var(--cream);font-family:var(--serif);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#0a0705;transform-origin:0 0}
.full{position:absolute;inset:0}

/* ---------- background ---------- */
.bg{background:radial-gradient(120% 75% at 50% 42%,#1d140b 0%,#110c07 48%,#070504 100%)}
#haze{background:radial-gradient(70% 28% at 50% 14%,rgba(205,150,80,.13),transparent 70%)}
#glow{position:absolute;left:-110px;top:480px;width:1300px;height:1300px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(222,160,74,.5),rgba(196,128,52,.2) 42%,rgba(160,100,40,.06) 70%,transparent 100%)}
.vig{background:radial-gradient(ellipse 85% 72% at 50% 48%,transparent 52%,rgba(0,0,0,.62) 100%)}
.grain{opacity:.075;mix-blend-mode:overlay}
#dust{position:absolute;left:0;top:0}
#flash{background:radial-gradient(circle at 50% 52%,#fff7e4 0%,rgba(250,214,150,.92) 30%,rgba(214,150,70,.55) 58%,rgba(0,0,0,0) 85%);opacity:0;visibility:hidden}

/* ---------- 3D layers ---------- */
.layer{position:absolute;inset:0;perspective:2400px;perspective-origin:540px 1130px;transform-origin:540px 1130px;visibility:hidden}
.rig{position:absolute;left:540px;top:1130px;width:0;height:0;transform-style:preserve-3d}
.rig>*{position:absolute;left:0;top:0}
.card{box-shadow:0 46px 100px rgba(0,0,0,.55),0 8px 22px rgba(0,0,0,.35)}

/* closed book */
.cb{transform-style:preserve-3d}
.cb .f{position:absolute;backface-visibility:hidden}
.edge-v{background:linear-gradient(90deg,rgba(0,0,0,.12),rgba(0,0,0,0) 40%,rgba(0,0,0,.18)),repeating-linear-gradient(90deg,#f8f2e4 0 2px,#ddd0b3 2px 3px)}
.edge-h{background:linear-gradient(0deg,rgba(0,0,0,.14),rgba(0,0,0,0) 40%,rgba(0,0,0,.1)),repeating-linear-gradient(0deg,#f8f2e4 0 2px,#ddd0b3 2px 3px)}
.cover{overflow:hidden;border-radius:3px 10px 10px 3px}
.cover .frame{position:absolute;border-radius:3px}
.cover .frame::after{content:'';position:absolute;inset:7px;border-radius:2px}
.cover .kick{position:absolute;width:100%;text-align:center;font-family:var(--mono);font-weight:500;letter-spacing:.42em}
.cover .orn{position:absolute;left:50%}
.cover .orn svg{display:block;width:100%;height:auto}
.cover .ttl{position:absolute;width:100%;text-align:center;font-family:var(--serif);font-weight:900}
.cover .au{position:absolute;width:100%;text-align:center;font-family:var(--serif);font-weight:600;letter-spacing:.08em}
.cover .lit{position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.28),rgba(255,255,255,0) 38%,rgba(0,0,0,0) 62%,rgba(0,0,0,.22))}

.ivory{background:repeating-linear-gradient(0deg,rgba(120,90,50,.045) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(120,90,50,.035) 0 1px,transparent 1px 4px),linear-gradient(160deg,#f5ecd9,#e7d9bb)}
.ivory .frame{inset:26px;border:2px solid #c39749}
.ivory .frame::after{border:1px solid rgba(195,151,73,.6)}
.ivory .kick{top:106px;font-size:19px;color:#a8803f}
.ivory .orn{top:172px;width:110px;margin-left:-55px}
.ivory .ttl{top:330px;font-size:64px;line-height:1.2;color:rgba(70,52,34,.2)}
.ivory .caret{display:inline-block;width:5px;height:68px;background:#b98236;vertical-align:-10px;margin-left:8px}
.ivory .rule{position:absolute;top:452px;left:50%;width:120px;margin-left:-60px;height:2px;background:#c39749}
.ivory .au{bottom:112px;font-size:25px;color:#8f6d3c}
.ivory .au i{display:inline-block;width:150px;border-bottom:2px solid #c39749;margin-left:12px;vertical-align:5px}
.spine-ivory{background:linear-gradient(90deg,#cbb893,#efe4cc 45%,#d3c19c)}
.spine-ivory::before,.spine-ivory::after{content:'';position:absolute;left:0;right:0;height:3px;background:#c39749}
.spine-ivory::before{top:80px}.spine-ivory::after{bottom:80px}
.back-ivory{background:#e3d6ba}

.genre .frame{inset:18px;border:1.5px solid rgba(226,178,94,.8)}
.genre .frame::after{border:1px solid rgba(226,178,94,.35)}
.genre .kick{top:68px;font-size:15px;color:rgba(240,206,140,.9)}
.genre .orn{top:112px;width:72px;margin-left:-36px}
.genre .ttl{top:196px;font-size:52px;line-height:1.28;background:linear-gradient(180deg,#fbe4a8 10%,#e8b862 55%,#c78a3a 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.genre .au{bottom:62px;font-size:19px;color:rgba(240,214,160,.9)}
.g-essay{background:linear-gradient(160deg,#2b4b39,#152a1f)}
.g-self{background:linear-gradient(160deg,#6a262c,#3a1216)}
.g-expert{background:linear-gradient(160deg,#243659,#111b30)}
.sp-essay{background:linear-gradient(90deg,#10211a,#22392c 50%,#10211a)}
.sp-self{background:linear-gradient(90deg,#2c0e11,#4d1a1f 50%,#2c0e11)}
.sp-expert{background:linear-gradient(90deg,#0c1424,#1b2a46 50%,#0c1424)}
.spine-g::before,.spine-g::after{content:'';position:absolute;left:0;right:0;height:2px;background:rgba(226,178,94,.8)}
.spine-g::before{top:44px}.spine-g::after{bottom:44px}

/* open book */
.ob{transform-style:preserve-3d}
.ob>*{position:absolute}
.ob-board{width:948px;height:640px;left:-474px;top:-320px;border-radius:12px;background:linear-gradient(180deg,#4d3521,#2a1b10);transform:translateZ(-18px);box-shadow:0 40px 90px rgba(0,0,0,.6)}
.ob-under{width:452px;height:614px;top:-307px;background:linear-gradient(90deg,#cdbb97,#e2d4b6)}
.ob-under.l{left:-460px;transform-origin:100% 50%;transform:translateZ(-9px) rotateY(9deg);border-radius:6px 0 0 6px}
.ob-under.r{left:8px;transform-origin:0 50%;transform:translateZ(-9px) rotateY(-9deg);border-radius:0 6px 6px 0;background:linear-gradient(90deg,#e2d4b6,#cdbb97)}
.ob-page{width:440px;height:600px;top:-300px;overflow:hidden}
.ob-page.l{left:-440px;transform-origin:100% 50%;transform:rotateY(11deg);border-radius:6px 0 0 6px;background:linear-gradient(90deg,#eee2c8 0%,#f8f1e2 16%,#f6eedc 80%,#d6c4a0 100%)}
.ob-page.r{left:0;transform-origin:0 50%;transform:rotateY(-11deg);border-radius:0 6px 6px 0;background:linear-gradient(90deg,#d6c4a0 0%,#f6eedc 20%,#f8f1e2 84%,#eee2c8 100%)}
.pg{position:absolute;top:48px;bottom:40px;font:400 17px/1.95 var(--serif);color:#3b3025}
.ob-page.l .pg{left:48px;right:40px}
.ob-page.r .pg{left:44px;right:44px}
.pg .ch{font:500 13px var(--mono);letter-spacing:.35em;color:#a8803f}
.pg .tt{font:700 30px/1.3 var(--serif);color:var(--ink);margin:10px 0 16px}
.pg .ln{white-space:nowrap;min-height:33px}
.pg .no{position:absolute;bottom:0;font:500 13px var(--mono);color:#a08a6a}
.ob-page.l .no{left:0}.ob-page.r .no{right:0}

/* genkoji (Korean manuscript paper) */
.genko{background:linear-gradient(160deg,#faf3e4,#efe4cc);border-radius:16px}
.genko .hdr{position:absolute;left:40px;right:40px;top:26px;display:flex;justify-content:space-between;font:500 16px var(--mono);letter-spacing:.3em;color:#b4553c}
.genko .grid{position:absolute;left:40px;top:66px}
.genko .row{position:absolute;left:0;height:40px;border-top:1.5px solid rgba(196,84,56,.62);border-bottom:1.5px solid rgba(196,84,56,.62);background:repeating-linear-gradient(90deg,rgba(196,84,56,.55) 0 1.5px,transparent 1.5px 40px)}
.genko .row::after{content:'';position:absolute;right:0;top:0;bottom:0;width:1.5px;background:rgba(196,84,56,.55)}
.genko .c{position:absolute;width:40px;height:40px;text-align:center;font:600 26px/40px var(--serif);color:#2b2219}
.genko .caret{position:absolute;width:3px;height:30px;background:#2b2219}

/* revision doc */
.doc{width:720px;height:860px;background:#f7f0e1;border-radius:16px;overflow:hidden}
.doc .bar{height:66px;background:#2a2119;display:flex;align-items:center;padding:0 26px;gap:10px}
.doc .dot{width:13px;height:13px;border-radius:50%}
.doc .fname{margin-left:14px;font:500 21px var(--mono);color:#ecdcbc}
.doc .body{position:absolute;top:66px;left:0;right:0;bottom:0;padding:56px 56px}
.doc .h{font:700 40px var(--serif);color:var(--ink);margin-bottom:22px}
.doc .ln{position:relative;font:400 26px/2.05 var(--serif);color:#3b3025;white-space:nowrap;width:max-content}
.doc .st{position:absolute;left:-6px;right:-6px;top:52%;height:3.5px;border-radius:2px;background:var(--red);transform-origin:0 50%}
.doc .rn{position:absolute;font:400 48px/1 var(--hand);color:var(--red);white-space:nowrap}

/* notes */
.note{padding:28px 32px 24px;font:400 54px/1.1 var(--hand);color:#3a2c1e;white-space:nowrap;border-radius:4px;box-shadow:0 24px 50px rgba(0,0,0,.45)}
.note::before{content:'';position:absolute;left:50%;top:-12px;width:90px;height:26px;margin-left:-45px;background:rgba(236,224,196,.6);transform:rotate(-3deg)}

/* pop-out cards */
.toc{width:600px;height:660px;background:#fbf6ea;border-radius:18px;padding:52px 52px}
.toc .k,.edit .k{font:500 16px var(--mono);letter-spacing:.42em;color:#b0853f}
.toc .t{font:900 54px var(--serif);color:var(--ink);margin:6px 0 22px}
.toc .row{position:relative;display:flex;align-items:baseline;font:600 25px/2.2 var(--serif);color:#3a2e22}
.toc .lead{flex:1;border-bottom:2px dotted rgba(120,90,50,.35);margin:0 12px;transform:translateY(-8px)}
.toc .n{font:500 20px var(--mono);color:#9c7a48}
.toc .mark{position:absolute;left:-14px;right:-14px;top:12px;bottom:10px;border-radius:6px;background:linear-gradient(90deg,rgba(236,190,100,.5),rgba(236,190,100,.22));transform-origin:0 50%;z-index:-1}
.chip{width:470px;height:132px;background:rgba(28,21,15,.97);border:1.5px solid rgba(226,178,94,.55);border-radius:22px;padding:24px 30px}
.chip .lb{display:flex;justify-content:space-between;align-items:baseline;font:500 18px var(--mono);letter-spacing:.16em;color:#e8c98a}
.chip .pct{display:inline-block;font:700 26px var(--mono);letter-spacing:.04em;color:#f6dca0}
.chip .bar{margin-top:20px;height:16px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.chip .fill{height:100%;transform-origin:0 50%;border-radius:8px;background:linear-gradient(90deg,#b98236,#f3d48c)}
.edit{width:880px;height:440px;background:#fbf6ea;border-radius:18px;padding:46px 52px}
.edit .before{margin-top:12px;font:600 31px/1.62 var(--serif);color:#6d5d4a}
.edit .del{position:relative;display:inline-block}
.edit .del .st{position:absolute;left:-3px;right:-3px;top:55%;height:3.5px;border-radius:2px;background:var(--red);transform-origin:0 50%}
.edit .arrow{display:flex;align-items:center;gap:14px;margin:20px 0 10px;font:500 16px var(--mono);letter-spacing:.42em;color:#b0853f}
.edit .arrow b{display:block;height:2px;width:60px;background:#d4a556}
.edit .after{position:relative;display:inline-block;font:700 35px/1.5 var(--serif);color:var(--ink)}
.edit .after .ul{position:absolute;left:-4px;right:-4px;bottom:4px;height:14px;border-radius:4px;background:rgba(236,190,100,.55);transform-origin:0 50%;z-index:-1}
.edit .rn{position:absolute;font:400 46px/1 var(--hand);color:var(--red);white-space:nowrap}

/* leaves (S6) */
#leaves{position:absolute;left:240px;top:780px;width:600px;height:600px;overflow:visible;filter:drop-shadow(0 0 26px rgba(240,186,96,.45))}

/* ---------- HUD (headlines / labels) ---------- */
.hl{position:absolute;top:205px;left:0;width:100%;text-align:center;font:900 88px/1.2 var(--serif);letter-spacing:-.02em;color:var(--cream);visibility:hidden}
.hl .line{display:block;white-space:nowrap}
.w{display:inline-block;text-shadow:0 6px 40px rgba(0,0,0,.55)}
.g{background:linear-gradient(180deg,#fbe4a8 10%,#e8b862 55%,#c78a3a 95%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.mono{position:absolute;top:466px;left:0;width:100%;text-align:center;font:500 27px var(--mono);letter-spacing:.3em;color:rgba(240,212,156,.92);white-space:pre;visibility:hidden}
.mono .rest{color:transparent}
.mono .cur{display:inline-block;width:14px;height:28px;margin:0 .1em 0 -.1em;background:#e2b25e;vertical-align:-4px}
.toggle{position:absolute;top:476px;left:50%;width:614px;margin-left:-307px;height:86px;border-radius:43px;background:rgba(255,255,255,.05);border:1.5px solid rgba(226,178,94,.38);visibility:hidden}
.toggle .knob{position:absolute;top:7px;left:7px;width:198px;height:69px;border-radius:35px;background:linear-gradient(180deg,#f6d996,#d9a650);box-shadow:0 0 34px rgba(230,170,80,.4)}
.toggle .opt{position:absolute;top:0;width:200px;height:83px;line-height:83px;text-align:center;font:700 27px var(--sans)}

/* ---------- end card ---------- */
#end{visibility:hidden;background:radial-gradient(120% 75% at 50% 36%,#22170c 0%,#120c07 50%,#070504 100%)}
#end .eglow{position:absolute;left:-60px;top:-60px;width:1200px;height:1200px;border-radius:50%;background:radial-gradient(closest-side,rgba(222,160,74,.42),rgba(196,128,52,.15) 46%,transparent 100%)}
#end .rays{position:absolute;left:-360px;top:-336px;width:1800px;height:1800px;background:repeating-conic-gradient(from 0deg,rgba(246,206,130,.075) 0deg 2.5deg,transparent 2.5deg 12deg);-webkit-mask:radial-gradient(closest-side,#000 12%,transparent 72%);mask:radial-gradient(closest-side,#000 12%,transparent 72%)}
#end .emb{position:absolute;left:200px;top:186px;width:680px;height:750px}
#end .emb img{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen}
#end .emb .shine{filter:brightness(1.9) saturate(1.1)}
.spark{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;filter:drop-shadow(0 0 14px rgba(255,220,150,.9))}
#end .ttl{position:absolute;top:972px;left:0;width:100%;text-align:center;font:900 76px/1.2 var(--serif);letter-spacing:-.02em;color:var(--cream)}
#end .tag{position:absolute;top:1090px;left:0;width:100%;text-align:center;font:700 42px/1.3 var(--serif);color:#efe3cc}
#end .lbl{position:absolute;top:1206px;left:0;width:100%;text-align:center;font:500 22px var(--mono);letter-spacing:.38em;color:rgba(236,205,146,.78)}
#end .ctaglow{position:absolute;top:1212px;left:50%;width:900px;height:220px;margin-left:-450px;border-radius:50%;background:radial-gradient(closest-side,rgba(236,176,84,.45),transparent 100%)}
#end .cta{position:absolute;top:1252px;left:50%;width:640px;height:118px;margin-left:-320px;border-radius:59px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:20px;color:#1d140b;font:700 50px var(--sans);letter-spacing:.01em;background:linear-gradient(180deg,#f9dd9c,#e2ad55 60%,#c98f3c);box-shadow:inset 0 0 0 1.5px rgba(255,236,190,.55),0 18px 50px rgba(0,0,0,.45)}
#end .cta svg{width:44px;height:44px;flex:none}
#end .cta .csh{position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.6) 50%,transparent 60%);background-size:300% 100%}
#end .fine{position:absolute;top:1424px;left:0;width:100%;text-align:center;font:400 20px var(--mono);letter-spacing:.06em;color:rgba(236,205,146,.45)}

/* ---------- preview controls (hidden when rendering) ---------- */
#ui{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0d0a07;border-top:1px solid #2a2016;font:500 13px var(--mono);color:#d9bf8a}
#ui button{width:40px;height:32px;border:1px solid #5a4528;border-radius:6px;background:#1a130c;color:#f0d49a;font:700 14px var(--mono);cursor:pointer}
#ui input{flex:1;accent-color:#d9a650}
body.render #ui{display:none}
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <div class="full bg"></div>
  <div class="full" id="haze"></div>
  <div id="glow"></div>

  <!-- S1: blank book -->
  <div class="layer" id="L-s1"><div class="rig"></div></div>
  <!-- S2: pain points -->
  <div class="layer" id="L-genko"><div class="rig"></div></div>
  <div class="layer" id="L-doc"><div class="rig"></div></div>
  <!-- S3/S4: open book + pop-out cards -->
  <div class="layer" id="L-ob"><div class="rig"></div></div>
  <div class="layer" id="L-cards">
    <div class="rig" id="R-toc"></div>
    <div class="rig" id="R-gk"></div>
    <div class="rig" id="R-edit"></div>
  </div>
  <div class="layer" id="L-notes"><div class="rig"></div></div>
  <!-- S5: genre carousel (one layer per book so each can dim independently) -->
  <div class="layer gw"><div class="rig"></div></div>
  <div class="layer gw"><div class="rig"></div></div>
  <div class="layer gw"><div class="rig"></div></div>
  <!-- S6: sprout -->
  <div class="layer" id="L-ob2"><div class="rig"></div></div>
  <div class="layer" id="L-leaf">
    <svg id="leaves" viewBox="-300 -560 600 600">
      <defs>
        <linearGradient id="lg" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#9c6a2c"/><stop offset=".45" stop-color="#d9a24e"/><stop offset="1" stop-color="#fbe3a4"/>
        </linearGradient>
        <radialGradient id="sg"><stop offset="0" stop-color="#fffaf0"/><stop offset=".45" stop-color="#ffe2a6"/><stop offset="1" stop-color="#e2a84e"/></radialGradient>
      </defs>
      <path id="stem" d="M0 40 C0 10 2 -20 0 -60" fill="none" stroke="#e6b866" stroke-width="7" stroke-linecap="round"/>
      <g id="lv"></g>
      <g id="star"><path d="M0 -60 C5 -12 12 -5 60 0 C12 5 5 12 0 60 C-5 12 -12 5 -60 0 C-12 -5 -5 -12 0 -60Z" fill="url(#sg)"/></g>
    </svg>
  </div>

  <!-- End card -->
  <div class="full" id="end">
    <div class="eglow"></div>
    <div class="rays"></div>
    <div class="emb">
      <img class="base" src="assets/kyt-emblem.webp" alt="KYT 새로운 책쓰기 연구소">
      <img class="shine" src="assets/kyt-emblem.webp" alt="">
    </div>
    <div class="ttl"></div>
    <div class="tag"></div>
    <div class="lbl"></div>
    <div class="ctaglow"></div>
    <div class="cta"><svg viewBox="0 0 24 24"><path fill="#1d140b" d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.32.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg><span class="num"></span><div class="csh"></div></div>
    <div class="fine"></div>
  </div>

  <div class="full" id="hud"></div>
  <canvas id="dust" width="1080" height="1920"></canvas>
  <div class="full" id="flash"></div>
  <div class="full grain" id="grain"></div>
  <div class="full vig"></div>
</div>
</div>
<div id="ui"><button id="play">❚❚</button><input id="scrub" type="range" min="0" step="0.001"><span id="tc">00.00</span></div>

<script>
/* ============================================================
   COPY — 화면에 나오는 모든 문구
   *단어* = 골드 강조, | = 줄바꿈

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  lin: t => t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutCubic: t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outQuint: t => 1 - Math.pow(1 - t, 5),
  outBack: t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
/** progress of t through [a, a+d], eased */
const p = (t, a, d, e = E.outCubic) => e(clamp((t - a) / d));
function keys(arr, t) {

    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/** closed hardcover book centred on its rig */
function makeBook(w, h, d, coverHTML, coverCls, spineCls, backCls) {
  const b = el('div', 'cb');
  const face = (cls, fw, fh, t, html = '') => {
    const f = el('div', 'f ' + cls, html);
    Object.assign(f.style, { width: fw + 'px', height: fh + 'px', left: -fw / 2 + 'px', top: -fh / 2 + 'px', transform: t });

  };
  face(backCls, w, h, `rotateY(180deg) translateZ(${d / 2}px)`);
  face('edge-v', d - 6, h - 10, `rotateY(90deg) translateZ(${w / 2 - 5}px)`);
  face('edge-h', w - 10, d - 6, `rotateX(90deg) translateZ(${h / 2 - 5}px)`);
  face('edge-h', w - 10, d - 6, `rotateX(-90deg) translateZ(${h / 2 - 5}px)`);
  face(spineCls, d, h, `rotateY(-90deg) translateZ(${w / 2}px)`);

}

/** genkoji: cols x rows grid of 40px cells, rows separated by `gap` */
function makeGenko(cols, rows, gap, hdrL, hdrR) {
  const cell = 40, gw = cols * cell, gh = rows * (cell + gap) - gap;
  const card = el('div', 'genko card');
  Object.assign(card.style, { width: gw + 80 + 'px', height: gh + 66 + 44 + 'px' });
  card.appendChild(el('div', 'hdr', `<span>${hdrL}</span><span>${hdrR}</span>`));
  const grid = el('div', 'grid'); Object.assign(grid.style, { width: gw + 'px', height: gh + 'px' });
  for (let r = 0; r < rows; r++) {
    const row = el('div', 'row'); Object.assign(row.style, { top: r * (cell + gap) + 'px', width: gw + 'px' });
    grid.appendChild(row);
  }
  const cells = [];
  for (let i = 0; i < cols * rows; i++) {
    const c = el('div', 'c'); const r = Math.floor(i / cols), k = i % cols;
    Object.assign(c.style, { left: k * cell + 'px', top: r * (cell + gap) + 'px' });
    grid.appendChild(c); cells.push(c);
  }
  const caret = el('div', 'caret'); grid.appendChild(caret);
  card.appendChild(grid);
  const placeCaret = i => { const r = Math.floor(i / cols), k = i % cols; caret.style.left = k * cell + 4 + 'px'; caret.style.top = r * (cell + gap) + 5 + 'px'; };
  return { card, cells, caret, placeCaret, cols };
}

/** headline: words get their own span so they can fade/blur in one by one */
function buildWords(target, text) {
  const words = [];
  let gold = false;
  text.split('|').forEach(line => {
    const ld = el('div', 'line');
    line.split(' ').forEach((tok, wi) => {
      const w = el('span', 'w');
      let buf = '';
      const flush = () => {
        if (!buf) return;
        if (gold) { const g = el('span', 'g'); g.textContent = buf; w.appendChild(g); } else w.appendChild(document.createTextNode(buf));
        buf = '';
      };
      for (const ch of tok) { if (ch === '*') { flush(); gold = !gold; } else buf += ch; }
      flush();
      if (wi > 0) ld.appendChild(document.createTextNode(' '));
      ld.appendChild(w); words.push(w);
    });
    target.appendChild(ld);
  });
  return words;
}
function wordsIn(words, t, start, out, stagger = .075) {
  const o = out == null ? 0 : p(t, out, .32, E.inCubic);
  words.forEach((w, i) => {
    const a = p(t, start + i * stagger, .5, E.outCubic);
    w.style.opacity = (a * (1 - o)).toFixed(4);
    w.style.transform = `translateY(${((1 - a) * 30 - o * 14).toFixed(2)}px) scale(${(1 - o * .03).toFixed(4)})`;
    const b = (1 - a) * 12 + o * 14;
    w.style.filter = b > .05 ? `blur(${b.toFixed(2)}px)` : 'none';
  });
}

/* dust + bursts */
const dctx = $('#dust').getContext('2d');
const DUST = (() => { const r = mulberry32(7), a = []; for (let i = 0; i < 90; i++) a.push({ x: r() * 1080, y: r() * 1920, vy: -(6 + r() * 26), vx: (r() - .5) * 8, r: .6 + r() * 2.2, ph: r() * 6.28, w: .8 + r() * 2.2, a: .25 + r() * .6 }); return a; })();
const BURSTS = [[11.05, 540, 1150, 70, 1], [18.12, 760, 1160, 36, .7], [26.35, 690, 960, 50, .9], [27.5, 540, 560, 90, 1.1]].map(([t0, cx, cy, n, k], bi) => {
  const r = mulberry32(300 + bi), parts = [];
  for (let i = 0; i < n; i++) { const ang = r() * Math.PI * 2; parts.push({ dx: Math.cos(ang), dy: Math.sin(ang), sp: (180 + r() * 720) * k, size: .8 + r() * 2.4, life: .7 + r() * .9 }); }
  return { t0, cx, cy, parts };
});
function drawDust(t) {
  dctx.clearRect(0, 0, 1080, 1920);
  const lvl = keys([[0, 0], [.7, .55], [10, .55], [11.1, 1], [21, .8], [25, .8], [27.4, 1.25], [32.5, 1]], t);
  dctx.globalCompositeOperation = 'lighter';
  for (const d of DUST) {
    const y = (((d.y + d.vy * t) % 1920) + 1920) % 1920;
    const x = d.x + d.vx * t + Math.sin(t * .5 + d.ph) * 14;
    const a = d.a * lvl * (.55 + .45 * Math.sin(t * d.w + d.ph));
    if (a <= 0) continue;
    dctx.globalAlpha = a * .22; dctx.fillStyle = '#f0b860';
    dctx.beginPath(); dctx.arc(x, y, d.r * 3.4, 0, 6.2832); dctx.fill();
    dctx.globalAlpha = a; dctx.fillStyle = '#ffe6b0';
    dctx.beginPath(); dctx.arc(x, y, d.r, 0, 6.2832); dctx.fill();
  }
  for (const b of BURSTS) {
    const age = t - b.t0;
    if (age < 0 || age > 1.7) continue;
    for (const q of b.parts) {
      if (age > q.life) continue;
      const dist = q.sp * (1 - Math.exp(-age * 3.2)) / 3.2;
      const x = b.cx + q.dx * dist, y = b.cy + q.dy * dist + 40 * age * age;
      const a = Math.pow(1 - age / q.life, 1.6);
      dctx.globalAlpha = a * .35; dctx.fillStyle = '#f2b45a';
      dctx.beginPath(); dctx.arc(x, y, q.size * 3.2, 0, 6.2832); dctx.fill();
      dctx.globalAlpha = a; dctx.fillStyle = '#fff1cc';
      dctx.beginPath(); dctx.arc(x, y, q.size, 0, 6.2832); dctx.fill();
    }
  }
  dctx.globalAlpha = 1; dctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   SOUND CUES — read by render.cjs and handed to audio/make_audio.py
   ============================================================ */
function cues() {
  const c = [];
  const add = (t, k, v = 1) => c.push({ t: +t.toFixed(4), k, v });
  [T.pain1, T.pain2, T.turn, T.step1, T.step2, T.step3, T.genre, T.journey].forEach(t => add(t, 'whoosh'));
  add(T.pain3, 'flutter'); add(9.98, 'flutter', .8);
  MONOS.forEach(m => m.text.forEach((ch, i) => { if (ch.trim()) add(m.tin + i * TYPE_RATE, 'tick', .55); }));
  PAIN_TYPE.forEach((ch, i) => { if (ch.trim()) add(4.85 + i * .068, 'key', .8); });
  for (let i = 0; i < PAIN_TYPE.length; i++) add(5.75 + i * .035, 'key', .45);
  DOC_EDITS.forEach(e => add(e.t, 'scratch'));
  [19.42, 19.68].forEach(t => add(t, 'scratch', .8));
  [13.95, 16.4, 18.9].forEach(t => add(t, 'pop'));
  [22.5, 23.75].forEach(t => add(t, 'click'));
  add(11.05, 'chime'); add(18.12, 'chime', .8); add(20.6, 'chime', .6); add(26.3, 'chime', .9); add(28.75, 'chime', 1);
  add(25.0, 'riser'); add(T.end, 'impact');
  return c.sort((a, b) => a.t - b.t);
}

/* ============================================================
   RUNTIME — preview player, or frame-by-frame render hooks
   ============================================================ */
const RENDER = new URLSearchParams(location.search).has('render');
window.__meta = { fps: FPS, duration: DURATION, width: 1080, height: 1920, bpm: 96, scenes: T, cues: cues() };
window.__seek = seek;
window.__ready = (async () => {
  await document.fonts.ready;
  const txt = document.body.textContent + Object.values(COPY).flat().join('') + '0123456789%탈고 완료원고_최종_진짜최종().hwp';
  const specs = ['900 88px "Noto Serif KR"', '700 40px "Noto Serif KR"', '600 26px "Noto Serif KR"', '400 17px "Noto Serif KR"',
    '700 27px "Noto Sans KR"', '500 27px "Noto Sans KR"', '500 25px "JetBrains Mono"', '700 26px "JetBrains Mono"',
    '400 25px "Nanum Gothic Coding"', '700 25px "Nanum Gothic Coding"', '400 48px "Nanum Pen Script"'];
  await Promise.all(specs.map(s => document.fonts.load(s, txt)));
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  seek(0);
  return true;
})();

if (RENDER) {
  document.body.classList.add('render');
} else {
  const stage = $('#stage'), vp = $('#viewport'), scrub = $('#scrub'), tc = $('#tc'), btn = $('#play');
  scrub.max = DURATION;
  const fit = () => {
    const s = Math.min(innerWidth / 1080, (innerHeight - 52) / 1920);
    stage.style.transform = `scale(${s})`;
    vp.style.left = (innerWidth - 1080 * s) / 2 + 'px';
    vp.style.top = Math.max(0, (innerHeight - 52 - 1920 * s) / 2) + 'px';
  };
  addEventListener('resize', fit); fit();
  let playing = true, t0 = performance.now(), cur = 0;
  const loop = now => {
    if (playing) { cur = ((now - t0) / 1000) % DURATION; seek(cur); scrub.value = cur; tc.textContent = cur.toFixed(2).padStart(5, '0'); }
    requestAnimationFrame(loop);
  };
  window.__ready.then(() => requestAnimationFrame(loop));
  const toggleP = () => { playing = !playing; btn.textContent = playing ? '❚❚' : '▶'; if (playing) t0 = performance.now() - cur * 1000; };
  btn.onclick = toggleP;
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggleP(); } });
  scrub.oninput = () => { cur = +scrub.value; seek(cur); tc.textContent = cur.toFixed(2).padStart(5, '0'); t0 = performance.now() - cur * 1000; };
}
</script>
