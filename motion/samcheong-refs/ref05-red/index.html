<html lang="ko"><head><meta charset="utf-8"><title>삼청동수제비 · 레퍼런스 5 (숯색과 빨강)</title>

<body><canvas id="c"></canvas>

<script>
/* 레퍼런스 5 문법: 숯색 바탕 + 빨강 한 가지 · 흐린 카드 격자 · 문제 카드 세 장 · 파도 위 마스코트(배 → 김 오르는 그릇) · 빛줄기 · 카드 · 이어지는 타임라인 · 로고 */
const RED = '#FF4B2E', BG = '#1c1e23', INK = '#2a2d34';

function base(t, gy = H * 0.3) { ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H); glow(W / 2, gy, 900, 'rgba(255,75,46,0.10)'); }
function head(segs, y, k, size = 64) {   // [[글, 빨강?], ...] 가운데 정렬 한 줄 — 단어마다 차례로

function postCard(x, y, w, h, q, meta, a = 1, o = {}) {

function sA(lt, t) {

function miniUI(i, x, y, w, h, lt) {

}
function sB(lt, t) {

}
function sea(t, y0, a = 1) {

    ctx.beginPath(); for (let x = 0; x <= W; x += 20) { const y = y0 + l * 34 + Math.sin(x * 0.006 + t * 1.6 + l) * (14 + l * 3); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
  }
  const g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, 'rgba(20,10,10,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0);
  ctx.restore();
}
function mascot(cx, cy, s, t) {   // 국물 위에 뜬 빨간 그릇 + 김
  ctx.save(); ctx.translate(cx, cy + Math.sin(t * 2) * 8); ctx.rotate(Math.sin(t * 1.6) * 0.05); ctx.scale(s, s);
  ctx.fillStyle = RED; ctx.beginPath(); ctx.moveTo(-120, -10); ctx.quadraticCurveTo(0, 150, 120, -10); ctx.closePath(); ctx.fill();
  ctx.fillRect(-138, -24, 276, 24); ctx.fillRect(-40, 60, 80, 22);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-34, 36, 9, 0, TAU); ctx.arc(34, 36, 9, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 48, 18, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.strokeStyle = RED; ctx.lineWidth = 10;
  for (let i = -1; i <= 1; i++) { const ph = (t * 0.8 + i * 0.3) % 1; ctx.globalAlpha = 1 - ph; ctx.beginPath(); ctx.moveTo(i * 44, -40 - ph * 40); ctx.bezierCurveTo(i * 44 - 22, -80 - ph * 40, i * 44 + 22, -110 - ph * 40, i * 44, -150 - ph * 40); ctx.stroke(); }
  ctx.restore();
}
function sC(lt, t) {
  base(t, H * 0.5); sea(t, H * 0.68);
  const k = eOutBack(prog(lt, 0, 0.6));
  mascot(W / 2 + 120, H * 0.62, 0.9 * k, t);
  text(typed('삼청동', prog(lt, 0.3, 1.0)), W / 2 - 200, H * 0.36, { weight: 800, size: 140, color: RED, align: 'right' });
}
function sD(lt, t) {
  base(t, H * 0.5); sea(t, H * 0.72);
  const bx = W / 2, by = H * 0.68;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createLinearGradient(bx, by, bx + 500, 260); g.addColorStop(0, 'rgba(255,90,60,0.5)'); g.addColorStop(1, 'rgba(255,90,60,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(bx, by - 120); ctx.lineTo(bx + 560, 180); ctx.lineTo(bx + 820, 330); ctx.closePath(); ctx.fill(); ctx.restore();

    const kk = eOutBack(prog(lt, d, d + 0.5)); if (kk <= 0) return;
    ctx.save(); ctx.translate(x + 200, y + 70); ctx.scale(kk, kk); ctx.translate(-(x + 200), -(y + 70));
    postCard(x, y, 400, 150, ['수제비 국물 미쳤어요~~', '감자전 진짜 최고~~!!!', '줄 서는데 충분한 명분이 있다!!'][i], '방문 리뷰', 1, { size: 26 }); ctx.restore();
  });
}
function sE(lt, t) {

  const k = eOutExpo(prog(lt, 0.3, 1.0));

  const k2 = eOutExpo(prog(lt, 0.8, 1.5));

  ctx.fillStyle = RED; fillRR(W / 2 - 16, 624 + (1 - k3) * 40, 120, 34, 17, RED); text('또 올게요', W / 2 + 44, 648 + (1 - k3) * 40, { weight: 800, size: 20, align: 'center' });
  text(typed('수제비 국물이 정말 맛있어서 2인분만 시킨게 아쉬웠지만', prog(lt, 2.4, 3.6)), W / 2 - 16, 710 + (1 - k3) * 40, { weight: 700, size: 27, color: '#222' });

  ctx.restore();
}
function sF(lt, t) {
  base(t);

  const steps = [['첫 방문', '줄 서서 수제비', '“드디어 궁금증 해결~!!”', 'pot'], ['두 번째', '감자전까지', '“감자전 진짜 최고~~!!!”', 'jeon'], ['그다음엔', '쭈꾸미도', '“쭈꾸미 정말 별미에요”', 'jjuk']];

function sG(lt, t) { base(t, H * 0.5); sea(t, H * 0.6); mascot(W / 2, H * 0.55, 1.0, t); }

const SCENES = [[T.a, sA], [T.b, sB], [T.c, sC], [T.d, sD], [T.e, sE], [T.f, sF], [T.g, sG], [T.h, sH]];
window.render = t => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
