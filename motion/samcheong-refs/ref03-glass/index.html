<script>
/* 레퍼런스 3 문법: 청록 · 파랑 · 보라가 흐르는 바탕 · 젖빛 유리 카드 · 검색 목록 · 입력창 · 패널 네 칸 · 사진 격자 · 알림과 말풍선 · 밤 시계 · 로고 */
const T = { a: [0, 4.5], b: [4.5, 8.5], c: [8.5, 12], d: [12, 15.5], e: [15.5, 18.5], f: [18.5, 24.5], g: [24.5, 27.5], h: [27.5, 30] };
const INK = '#0f1c26', TEAL = '#38d6e8';
function sky(t, mood = 0) {   // 흐르는 그라데이션 + 흐린 빛 덩어리

const card = (x, y, w, h, r, a, content, dark) => glass(x, y, w, h, r, { alpha: a, fill: dark ? 'rgba(18,30,44,0.78)' : 'rgba(255,255,255,0.22)', content, shadowColor: 'rgba(10,20,40,0.25)' });

function sD(lt, t) {

}
function sE(lt, t, d) {
  sky(t, 1);
  const z = lerp(1.6, 0.85, eInOutCubic(prog(lt, 0, d)));
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.rotate(-0.08);

  for (let r = -5; r <= 5; r++) for (let c = -3; c <= 3; c++) {

    photoCard(IMG[key], c * 250, r * 330, 230, 310, { r: 22, shadow: false, z: 1.1 + hash(i) * 0.4, fx: hash(i + 2), alpha: 0.95 });

  }
  ctx.restore();
  card(W / 2 - 330, H / 2 - 110, 660, 220, 40, prog(lt, 0.6, 1.0), () => { T1('수제비 · 감자전 · 쭈꾸미', W / 2, H / 2 - 20, 42, { a: 'center', w: 800 }); T1('방문 리뷰에 나온 메뉴', W / 2, H / 2 + 50, 30, { a: 'center', w: 600, c: 'rgba(255,255,255,0.75)' }); }, true);

function bubble(x, y, w, s, k, mine, sub) {
  if (k <= 0) return;
  const lines = s.split('\n'), h = 70 + lines.length * 52 + (sub ? 40 : 0);
  ctx.save(); ctx.globalAlpha = clamp(k * 2); ctx.translate(0, (1 - eOutBack(k)) * 40);
  card(x, y, w, h, 34, 1, () => {
    lines.forEach((l, i) => T1(l, x + 36, y + 70 + i * 52, 38, { c: mine ? INK : '#fff', w: 600 }));
    if (sub) T1(sub, x + 36, y + h - 28, 26, { c: mine ? 'rgba(15,28,38,0.55)' : 'rgba(255,255,255,0.6)', w: 600 });
  }, !mine);
  if (!mine) { ctx.fillStyle = TEAL; ctx.beginPath(); ctx.arc(x - 34, y + h - 30, 22, 0, TAU); ctx.fill(); }
  ctx.restore();
}
function sF(lt, t) {

  card(510, 520, 500, 240, 30, prog(lt, 0.4, 0.8), () => {

function sG(lt, t) {

function sH(lt, t) {

const SCENES = [[T.a, sA], [T.b, sB], [T.c, sC], [T.d, sD], [T.e, sE], [T.f, sF], [T.g, sG], [T.h, sH]];
