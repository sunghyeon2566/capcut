<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영진텍스타일</title>
<style>
  /* fetch_fonts.sh 가 받은 파일 이름 규칙: <Family>-<weight>.ttf */
  @font-face { font-family: 'NotoKR'; src: url(fonts/NotoSansKR-500.ttf); font-weight: 500; }
  @font-face { font-family: 'NotoKR'; src: url(fonts/NotoSansKR-700.ttf); font-weight: 700; }
  @font-face { font-family: 'NotoKR'; src: url(fonts/NotoSansKR-900.ttf); font-weight: 900; }
  @font-face { font-family: 'NotoSerif'; src: url(fonts/NotoSerifKR-700.ttf); font-weight: 700; }
  @font-face { font-family: 'Inter'; src: url(fonts/Inter-800.ttf); font-weight: 800; }
  @font-face { font-family: 'Mono'; src: url(fonts/JetBrainsMono-400.ttf); font-weight: 400; }
  @font-face { font-family: 'Mono'; src: url(fonts/JetBrainsMono-700.ttf); font-weight: 700; }
  @font-face { font-family: 'ISerif'; src: url(fonts/InstrumentSerif-Italic.ttf); font-weight: 400; font-style: italic; }
  html, body { margin: 0; height: 100%; background: #000; color: #aaa; font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #c { display: block; max-width: 100vw; max-height: calc(100vh - 56px); background: #000; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100vw, 960px); padding: 0 12px; box-sizing: border-box; }
  .bar button { background: #111; color: #eee; border: 1px solid #555; padding: 6px 12px; cursor: pointer; }
  .bar input { flex: 1; }
  body.render { display: block; }
  body.render #c { max-width: none; max-height: none; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button id="play">재생</button>
  <input id="seek" type="range" min="0" max="1" step="0.001" value="0">
  <span id="time">0.00s</span>
</div>
<audio id="snd" src="out/sound.wav" preload="auto"></audio>
<!-- 연락처는 저장소에 올리지 않는 local.js 에 둔다(없으면 기본 문구) -->
<script src="local.js"></script>
<script>
/* ============================================================
   (주)영진텍스타일 — 홍보 모션 영상
   레퍼런스("ONE SECOND": 검은 우주, 입자로 모이는 제목, 크게 올라가는 숫자 + 기울임 설명,
   빛나는 천체, 심전도 선, 짧은 문장, 입자 폭발 뒤 제목)의 구조를 따르고,
   천체 자리에 실패·테이프 롤·직조 라벨, 심전도 자리에 박음질 선을 둔다.
   사진(assets/factory1·factory2·products·pet)이 있으면 그 장면에 쓰고, 없으면 그래픽으로 대신한다.
   모든 프레임은 시간 t만으로 결정된다. 무작위는 hash(n)로.
   ============================================================ */

/* ---------- 1. 설정 ---------- */
const W = 1920, H = 1080, FPS = 30;
const BPM = 80, B = 60 / BPM;                // sound.py와 같은 값
const T = {
  intro: [0, 3], title: [3, 7.5], warp: [7.5, 8.25],
  people: [8.25, 14.25], factory: [14.25, 20.25], products: [20.25, 27.75], clients: [27.75, 33.75],
  moq: [34, 40], lines: [40, 43.5], burst: [43.5, 44.25], end: [44.25, 50],
};
const DUR = 50;

// 문구 — 회사가 준 정보에만 근거
const COPY = {
  hudL: '(주)영진텍스타일 · 영진섬유',
  introLabel: '한 올의 실에서',
  titleText: '영진텍스타일',
  titleSub: 'a short film about a single thread',
  people: { tag: '01 — PEOPLE', n: 20, unit: '명', desc: '생산 가능 인력', mono: '서울시 동대문구 장안동 공장', orange: 'WORKERS' },
  factory: { tag: '02 — FACTORY', head: '공장', desc: '실이 테이프와 라벨이 되는 곳', mono: '서울시 동대문구 장안동 398-7' },
  products: { tag: '03 — PRODUCTS', unit: '품목', items: ['자가드', '면테이프', 'POLY테이프', '라벨'], mono: '자가드 · 면테이프 · POLY테이프 · 라벨',
    pet: '테이프 활용 예 — 반려동물 하네스·목줄' },
  clients: { tag: '04 — CLIENTS', names: ['제일모직', 'LG패션', '신세계', '이랜드'], desc: '주요 납품실적', more: '+ 동대문시장 납품중' },
  moq: { tag: '05 — ORDER', lines: ['최소 생산 수량은 없습니다', '스타일별 · 사이즈별 소량도'], dots: ['1', '10', '100', '1,000+'], note: '소량 주문은 단가가 조금 올라갑니다' },
  lines: ['자가드부터 라벨까지.', '한 올 한 올.'],
  endSub: '(주)영진텍스타일  ·  영진섬유',
  endProducts: '자가드  ·  면테이프  ·  POLY테이프  ·  라벨',
  endAddr: '서울시 동대문구 장안동 398-7',
  contact: (window.LOCAL && window.LOCAL.contact) || '',
  biz: (window.LOCAL && window.LOCAL.biz) || '',
};

const C = { white: '#f2efe9', grey: '#8d8a85', orange: '#ff5a2a', warm: '#ffb877', cool: '#cfe4ff' };

/* ---------- 2. 수학 ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eOutExpo = k => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
const eInCubic = k => k * k * k;
const eInOutCubic = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

const cv = document.getElementById('c');
cv.width = W; cv.height = H;
if (!new URLSearchParams(location.search).has('render')) cv.style.aspectRatio = `${W} / ${H}`;
const ctx = cv.getContext('2d');

/* ---------- 3. 텍스트 ---------- */
function setFont(o) {
  ctx.font = `${o.italic ? 'italic ' : ''}${o.weight ?? 400} ${o.size ?? 60}px ${o.fam ?? 'NotoKR'}`;
  ctx.textAlign = o.align ?? 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.letterSpacing = (o.ls ?? 0) + 'px';
}
function text(s, x, y, o = {}) {
  ctx.save();
  setFont(o);
  ctx.globalAlpha *= o.alpha ?? 1;
  if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = o.shadowBlur ?? 12; }
  ctx.fillStyle = o.color ?? C.white;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, o) { ctx.save(); setFont(o); const w = ctx.measureText(s).width; ctx.restore(); return w; }
const MONO = 'Mono, NotoKR';
const mono = (s, x, y, color, o = {}) => text(s, x, y, { fam: MONO, size: o.size ?? 16, ls: o.ls ?? 3, align: o.align ?? 'left', color, alpha: o.alpha });
// 기울인 명조(레퍼런스의 이탤릭 설명) — 한글은 기울임 글꼴이 없어 기울여 그린다
function italic(s, x, y, size, o = {}) {
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  ctx.translate(x, y); ctx.transform(1, 0, -0.2, 1, 0, 0);
  const latin = /^[\x00-\x7F]*$/.test(s);
  setFont({ fam: latin ? 'ISerif' : 'NotoSerif', italic: latin, weight: latin ? 400 : 700, size: latin ? size * 1.15 : size, align: o.align ?? 'left' });
  ctx.fillStyle = o.color ?? C.white; ctx.fillText(s, 0, 0);
  ctx.restore();
}
// 한 단어씩 흐림 → 선명(레퍼런스 문장 등장)
function wordsIn(s, x, y, size, lt, t0, step = 0.12, o = {}) {
  const ws = s.split(' ');
  const total = ws.reduce((a, w, i) => a + measureItalic(w + (i < ws.length - 1 ? ' ' : ''), size), 0);
  let cx = o.align === 'center' ? x - total / 2 : x;
  ws.forEach((w, i) => {
    const k = prog(lt, t0 + i * step, t0 + i * step + 0.5), ww = measureItalic(w + ' ', size);
    if (k > 0) { ctx.save(); if (k < 1) ctx.filter = `blur(${((1 - k) * 8).toFixed(1)}px)`; italic(w, cx, y + (1 - eOutCubic(k)) * 10, size, { alpha: k * (o.alpha ?? 1), color: o.color }); ctx.restore(); }
    cx += ww;
  });
}
function measureItalic(s, size) { const latin = /^[\x00-\x7F]*$/.test(s); return measure(s, { fam: latin ? 'ISerif' : 'NotoSerif', italic: latin, weight: latin ? 400 : 700, size: latin ? size * 1.15 : size }); }
// 큰 숫자 + 흐린 앞자리 0(레퍼런스의 "058,645")
function bigNumber(n, digits, x, y, unit, a = 1) {
  const s = String(Math.round(n)).padStart(digits, '0'), o = { fam: 'Inter', weight: 800, size: 150, ls: -4 };
  let lead = 0; while (lead < s.length - 1 && s[lead] === '0') lead++;
  const ghost = s.slice(0, lead), main = s.slice(lead);
  const gw = measure(ghost, o);
  if (ghost) text(ghost, x, y, { ...o, color: 'rgba(242,239,233,0.16)', alpha: a });
  text(main, x + gw, y, { ...o, alpha: a });
  if (unit) text(unit, x + gw + measure(main, o) + 14, y, { weight: 700, size: 50, alpha: a });
}

/* ---------- 4. 바탕·HUD ---------- */
function space(t, glow = 0) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 160; i++) {
    const x = hash(i * 3.3) * W, y = hash(i * 7.1) * H, a = 0.15 + 0.35 * hash(i * 2.2) * (0.6 + 0.4 * Math.sin(t * (0.5 + hash(i)) + i));
    ctx.fillStyle = `rgba(230,225,215,${a})`; ctx.fillRect(x, y, hash(i * 5) < 0.1 ? 2 : 1.2, hash(i * 5) < 0.1 ? 2 : 1.2);
  }
  if (glow > 0) {
    const g = ctx.createRadialGradient(W * 0.68, H * 0.5, 0, W * 0.68, H * 0.5, W * 0.5);
    g.addColorStop(0, `rgba(255,170,90,${0.12 * glow})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}
function tc(t) { const f = Math.floor(t * FPS); return `${String(Math.floor(f / FPS)).padStart(2, '0')}:${String(f % FPS).padStart(2, '0')}`; }
function hud(t, a = 1) {
  if (a <= 0) return;
  const col = 'rgba(200,195,185,0.4)', m = 36;
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = 1.2;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => { ctx.beginPath(); ctx.moveTo(x, y + sy * 12); ctx.lineTo(x, y); ctx.lineTo(x + sx * 12, y); ctx.stroke(); });
  mono(COPY.hudL, m + 24, m + 26, col, { size: 13 });
  mono(`TC 00:00:${tc(t)}`, W - m - 24, m + 26, col, { size: 13, align: 'right' });
  const x0 = m + 24, x1 = W * 0.33, y = H - m - 36, k = clamp(t / DUR);
  ctx.fillStyle = 'rgba(200,195,185,0.2)'; ctx.fillRect(x0, y, x1 - x0, 1.5);
  ctx.fillStyle = C.orange; ctx.fillRect(x0, y, (x1 - x0) * k, 1.5);
  ctx.beginPath(); ctx.arc(x0 + (x1 - x0) * k, y, 3.5, 0, TAU); ctx.fill();
  mono(`${t.toFixed(1)} s`, x0 + (x1 - x0) * k, y - 10, 'rgba(242,239,233,0.7)', { size: 11, align: 'center' });
  mono('ELAPSED', x0, y + 22, col, { size: 11 });
  mono(`${DUR.toFixed(1)} s`, x1, y + 22, col, { size: 11, align: 'right' });
  ctx.restore();
}
// 장 머리(주황 라벨) + 숫자/제목 + 이탤릭 설명 + 모노 줄
function chapterText(lt, d, o) {
  const x = 150, y = H * 0.47, out = 1 - prog(lt, d - 0.35, d);
  ctx.save(); ctx.globalAlpha = out;
  mono(o.tag, x + 4, y - 150, C.orange, { size: 15, alpha: prog(lt, 0.1, 0.4) });
  o.big(x, y);
  if (o.desc) wordsIn(o.desc, x + 4, y + 68, 46, lt, 0.5, 0.12);
  if (o.mono) mono(o.mono, x + 6, y + 118, 'rgba(200,195,185,0.6)', { size: 15, alpha: prog(lt, 0.9, 1.3) });
  if (o.orange) mono(o.orange, x + 6, y + 150, C.orange, { size: 15, alpha: prog(lt, 1.1, 1.5) });
  ctx.restore();
}

/* ---------- 5. 사진(있으면 사용) ---------- */
const IMG = {};
function loadImage(key, src) { return new Promise(res => { const im = new Image(); im.onload = () => { IMG[key] = im; res(im); }; im.onerror = () => res(null); im.src = src; }); }
// 영화처럼 천천히 밀고 들어가는 사진(어둡게 깔고 따뜻하게)
function photo(img, cx, cy, w, h, lt, d, o = {}) {
  if (!img) return false;
  const k = eOutCubic(prog(lt, 0, 0.5)), out = 1 - prog(lt, d - 0.35, d);
  const s = lerp(1.0, 1.08, lt / d), iw = img.width, ih = img.height, sc = Math.max(w / iw, h / ih) * s;
  ctx.save(); ctx.globalAlpha = k * out;
  ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, 6); ctx.clip();
  ctx.filter = 'brightness(0.92) saturate(0.95) contrast(1.05)';
  const px = (o.panX ?? 0) * (lt / d) * 60;
  ctx.drawImage(img, cx - iw * sc / 2 + px, cy - ih * sc / 2, iw * sc, ih * sc);
  ctx.filter = 'none';
  const v = ctx.createRadialGradient(cx, cy, Math.min(w, h) * 0.3, cx, cy, Math.max(w, h) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
  ctx.restore();
  ctx.save(); ctx.globalAlpha = k * out * 0.6; ctx.strokeStyle = 'rgba(255,184,119,0.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, 6); ctx.stroke(); ctx.restore();
  return true;
}

/* ---------- 6. 그래픽: 실패, 테이프 롤, 직조 라벨, 박음질 선 ---------- */
// 실패(실 감는 통) — 둘레를 빛이 돈다(레퍼런스의 지구를 도는 빛)
function spool(cx, cy, t, lit = 1) {
  const R = 150, Hs = 330, ry = R * 0.3, a = t * 2.2, orbitR = R * 2.1, tilt = -0.22;
  const orbit = (ang) => { const x = Math.cos(ang) * orbitR, y = Math.sin(ang) * orbitR * 0.32; return [cx + x * Math.cos(tilt) - y * Math.sin(tilt), cy + x * Math.sin(tilt) + y * Math.cos(tilt), Math.sin(ang)]; };
  const drawTrail = front => {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 70; i++) {
      const p = orbit(a - i * 0.03);
      if ((p[2] > 0) !== front) continue;
      const al = (1 - i / 70) * lit;
      ctx.fillStyle = `rgba(255,220,180,${0.6 * al})`; ctx.beginPath(); ctx.arc(p[0], p[1], 3.2 * (1 - i / 90), 0, TAU); ctx.fill();
    }
    const p = orbit(a);
    if ((p[2] > 0) === front) {
      const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], 220);
      g.addColorStop(0, `rgba(255,240,220,${0.9 * lit})`); g.addColorStop(0.15, `rgba(255,190,120,${0.35 * lit})`); g.addColorStop(1, 'rgba(255,150,80,0)');
      ctx.fillStyle = g; ctx.fillRect(p[0] - 220, p[1] - 220, 440, 440);
    }
    ctx.restore();
  };
  drawTrail(false);
  // 위 테두리판(뒤쪽 반)
  const flange = (y, top) => {
    ctx.beginPath(); ctx.ellipse(cx, y, R * 1.22, ry * 1.22, 0, 0, TAU);
    const g = ctx.createLinearGradient(cx - R * 1.2, 0, cx + R * 1.2, 0);
    g.addColorStop(0, '#2a1d14'); g.addColorStop(0.45, '#6b4b33'); g.addColorStop(1, '#1d140e');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(255,200,150,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
  };
  flange(cy + Hs / 2, false);
  // 몸통(감긴 실)
  const bg = ctx.createLinearGradient(cx - R, 0, cx + R, 0);
  bg.addColorStop(0, '#3a2a20'); bg.addColorStop(0.3, '#d9a16a'); bg.addColorStop(0.55, '#f2c99a'); bg.addColorStop(1, '#4a3022');
  ctx.fillStyle = bg; ctx.fillRect(cx - R, cy - Hs / 2, R * 2, Hs);
  ctx.beginPath(); ctx.ellipse(cx, cy + Hs / 2, R, ry, 0, 0, Math.PI); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(cx - R, cy - Hs / 2, R * 2, Hs + ry); ctx.clip();
  ctx.strokeStyle = 'rgba(60,35,20,0.35)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 64; i++) { const y = cy - Hs / 2 + i * (Hs / 64) + Math.sin(i * 1.7 + t * 0.6) * 1.2; ctx.beginPath(); ctx.ellipse(cx, y, R, ry, 0, 0.08, Math.PI - 0.08); ctx.stroke(); }
  ctx.restore();
  // 빛 반사
  const sp = ctx.createLinearGradient(cx - R, 0, cx + R, 0);
  sp.addColorStop(0, 'rgba(255,255,255,0)'); sp.addColorStop(0.5 + 0.25 * Math.sin(a), `rgba(255,230,200,${0.25 * lit})`); sp.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sp; ctx.fillRect(cx - R, cy - Hs / 2, R * 2, Hs);
  flange(cy - Hs / 2, true);
  ctx.beginPath(); ctx.ellipse(cx, cy - Hs / 2, R * 0.28, ry * 0.28, 0, 0, TAU); ctx.fillStyle = '#0b0705'; ctx.fill();
  drawTrail(true);
}
// 테이프 롤(사진이 없을 때 제품 장면)
function tapeRoll(cx, cy, t, beatK) {
  const R = 300;
  const halo = ctx.createRadialGradient(cx, cy, R * 0.8, cx, cy, R * 1.5);
  halo.addColorStop(0, 'rgba(255,170,100,0.25)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.fillRect(cx - R * 1.6, cy - R * 1.6, R * 3.2, R * 3.2);
  for (let i = 0; i < 46; i++) {
    const r = R - i * 4.6, c = i % 2 ? [210, 120, 70] : [240, 175, 110];
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${0.55 + 0.25 * hash(i)})`; ctx.lineWidth = 4.6; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.28, 0, TAU); ctx.fillStyle = '#000'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,180,0.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
  if (beatK > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R); g.addColorStop(0, `rgba(255,230,200,${0.4 * beatK})`); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(cx - R, cy - R, R * 2, R * 2); ctx.restore(); }
}
// 직조 라벨(레퍼런스의 태양) — 따뜻한 빛과 실 같은 빛줄기
function wovenLabel(cx, cy, t, k) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(cx, cy, 60, cx, cy, 620);
  halo.addColorStop(0, `rgba(255,190,110,${0.55 * k})`); halo.addColorStop(0.4, `rgba(255,140,60,${0.18 * k})`); halo.addColorStop(1, 'rgba(0,0,0,0)');

  }

  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);

  setFont({ weight: 900, size: 92, align: 'center' }); ctx.fillStyle = 'rgba(110,50,15,0.75)'; ctx.fillText('영진', 0, 32);
  ctx.strokeStyle = 'rgba(110,50,15,0.5)'; ctx.lineWidth = 2; ctx.strokeRect(-w / 2 + 16, -h / 2 + 16, w - 32, h - 32);

}
// 박음질 선(레퍼런스의 심전도) — 바늘이 찌르는 자리에서 위로 솟는다
function stitchLine(lt, y) {
  const k = eInOutCubic(prog(lt, 0.1, 2.4)), x1 = W * k;
  const spike = x => { const p = ((x - 380) % 620 + 620) % 620; if (p > 60) return 0; const u = p / 60; return Math.sin(u * Math.PI * 2) * (u < 0.5 ? -110 : 40) * Math.sin(u * Math.PI); };
  ctx.save(); ctx.strokeStyle = C.orange; ctx.lineWidth = 2.4; ctx.shadowColor = 'rgba(255,90,42,0.7)'; ctx.shadowBlur = 10;
  ctx.setLineDash([22, 12]); ctx.lineDashOffset = -lt * 40;

  ctx.restore();

/* ---------- 7. 입자 제목 ---------- */
let TITLE_PTS = [];
function buildTitle() {
  const c = document.createElement('canvas'); c.width = W; c.height = 400;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.font = `900 210px NotoKR`; g.textAlign = 'center'; g.letterSpacing = '-4px';
  g.fillText(COPY.titleText, W / 2, 280);
  const d = g.getImageData(0, 0, W, 400).data, pts = [];
  for (let y = 0; y < 400; y += 3) for (let x = 0; x < W; x += 3) if (d[(y * W + x) * 4 + 3] > 120) pts.push([x + (hash(x + y * 7) - 0.5) * 2, y - 200 + (hash(x * 3 + y) - 0.5) * 2]);
  pts.sort((a, b) => hash(a[0] * 0.37 + a[1] * 9.1) - hash(b[0] * 0.37 + b[1] * 9.1));
  TITLE_PTS = pts.slice(0, 9000);
}
// k: 모임 정도(0 흩어짐 → 1 글자), cy: 글자 중심 높이
function particleTitle(t, k, cy, burst = 0) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  if (k > 0.85 && burst === 0) {                         // 다 모이면 흐린 빛
    ctx.globalAlpha = (k - 0.85) / 0.15 * 0.35; ctx.filter = 'blur(18px)';
    setFont({ weight: 900, size: 210, ls: -4, align: 'center' }); ctx.fillStyle = '#ffffff'; ctx.fillText(COPY.titleText, W / 2, cy + 80);
    ctx.filter = 'none'; ctx.globalAlpha = 1;
  }
  for (let i = 0; i < TITLE_PTS.length; i++) {
    const [tx, ty] = TITLE_PTS[i], warm = hash(i * 2.3) < 0.5;
    const ki = clamp((k - hash(i * 5.1) * 0.25) / 0.75);
    const e = eInOutCubic(ki);
    // 흩어진 자리: 왼쪽 따뜻한 구름 / 오른쪽 차가운 구름이 소용돌이
    const sa = hash(i * 1.7) * TAU + t * (warm ? 0.8 : -0.8), sr = 150 + hash(i * 3.9) * 520;
    const sx = (warm ? W * 0.35 : W * 0.65) + Math.cos(sa) * sr * 1.3, sy = H / 2 + Math.sin(sa) * sr * 0.55;
    let x = lerp(sx, tx, e), y = lerp(sy, cy + ty, e);
    if (burst > 0) { const ba = hash(i * 8.3) * TAU, br = eOutCubic(burst) * (300 + hash(i * 6.1) * 1200); x += Math.cos(ba) * br; y += Math.sin(ba) * br * 0.6; }
    const flick = 0.55 + 0.45 * hash(i + Math.floor(t * 12) * 0.37);
    const a = (0.3 + 0.7 * e) * flick * (1 - burst);
    ctx.fillStyle = warm && e < 0.9 ? `rgba(255,170,110,${a})` : `rgba(240,240,245,${a})`;
    ctx.fillRect(x, y, 1.8, 1.8);
  }
  ctx.restore();
}

// 가운데 점에서 입자가 밝게 터진다(레퍼런스 41.5초)
function burst(k, t) {
  const cx = W / 2, cy = H * 0.44, e = eOutCubic(k);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 500 + 400 * e);
  g.addColorStop(0, `rgba(255,240,225,${0.7 * (1 - k)})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 4000; i++) {
    const a = hash(i * 1.31) * TAU, sp = 120 + Math.pow(hash(i * 2.77), 0.6) * 1100, r = e * sp;
    const x = cx + Math.cos(a) * r * 1.4, y = cy + Math.sin(a) * r * 0.55 + Math.sin(i + t * 3) * 4;
    const warm = hash(i * 4.1) < 0.45, al = (1 - k * 0.75) * (0.4 + 0.6 * hash(i * 6.3));
    ctx.fillStyle = warm ? `rgba(255,170,110,${al})` : `rgba(235,240,250,${al})`;
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.restore();
}

/* ---------- 8. 장면 ---------- */
function sceneIntro(lt, t) {

  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(200,195,185,0.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, 22, 0, TAU); ctx.stroke();

    for (let i = 0; i < 60; i++) { const a = i / 60 * TAU - Math.PI / 2; ctx.fillStyle = i / 60 < k ? 'rgba(255,90,42,0.8)' : 'rgba(200,195,185,0.2)'; ctx.fillRect(cx + Math.cos(a) * 70 - 1, cy + Math.sin(a) * 70 - 1, 2, 2); }
    const ha = -Math.PI / 2 + TAU * k; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + Math.cos(ha) * 58, cy + Math.sin(ha) * 58, 4, 0, TAU); ctx.fill();
  }

  // 끝에서 입자가 소용돌이친다

}
function sceneTitle(lt, t) {
  space(t);

  if (out > 0) { ctx.fillStyle = `rgba(255,250,240,${eInCubic(out) * 0.9})`; ctx.fillRect(0, 0, W, H); }
}
function sceneWarp(lt, t, d) {
  const k = lt / d;
  ctx.fillStyle = `rgb(${lerp(230, 0, eOutCubic(k)) | 0},${lerp(225, 0, eOutCubic(k)) | 0},${lerp(215, 0, eOutCubic(k)) | 0})`; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 260; i++) {
    const a = hash(i * 1.3) * TAU, r0 = 40 + hash(i * 2.1) * 200, len = (200 + hash(i * 4.4) * 700) * (0.4 + k);
    const r = r0 + k * (600 + hash(i * 5) * 900);

    ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * r, H / 2 + Math.sin(a) * r); ctx.lineTo(W / 2 + Math.cos(a) * (r + len), H / 2 + Math.sin(a) * (r + len)); ctx.stroke();
  }

}
function scenePeople(lt, t, d) {

}

/* ---------- 9. 한 프레임 ---------- */
function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  const in_ = k => t >= T[k][0] && t < T[k][1], lt = k => t - T[k][0], d = k => T[k][1] - T[k][0];
  let hudA = 1;
  if (in_('intro')) { sceneIntro(lt('intro'), t); hudA = 0; }
  else if (in_('title')) { sceneTitle(lt('title'), t); hudA = 0; }
  else if (in_('warp')) { sceneWarp(lt('warp'), t, d('warp')); hudA = 0; }
  else if (in_('people')) scenePeople(lt('people'), t, d('people'));
  else if (in_('factory')) sceneFactory(lt('factory'), t, d('factory'));
  else if (in_('products')) sceneProducts(lt('products'), t, d('products'));
  else if (in_('clients')) sceneClients(lt('clients'), t, d('clients'));
  else if (t >= T.clients[1] && t < T.moq[0]) { const k = prog(t, T.clients[1], T.moq[0]); ctx.fillStyle = `rgba(245,240,230,${1 - k * 0.3})`; ctx.fillRect(0, 0, W, H); hudA = 0; }  // 하얀 섬광
  else if (in_('moq')) sceneMoq(lt('moq'), t, d('moq'));
  else if (in_('lines')) { sceneLines(lt('lines'), t, d('lines')); hudA = 0.4; }
  else if (in_('burst')) { space(t); burst(prog(t, T.burst[0], T.burst[1]), t); hudA = 0; }
  else { sceneEnd(lt('end'), t, d('end')); hudA = 0; }
  hud(t, hudA);
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.65);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const fo = prog(t, DUR - 0.8, DUR);
  if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
}

    document.fonts.load('700 40px NotoSerif', '가'), document.fonts.load('800 40px Inter', '0'),

  const snd = document.getElementById('snd'), seek = document.getElementById('seek'), btn = document.getElementById('play'), lab = document.getElementById('time');
  seek.max = DUR;
  let playing = false, tAt = Number(params.get('t') || 0), t0 = performance.now();
  render(tAt);
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? '일시정지' : '재생'; t0 = performance.now(); if (playing) { snd.currentTime = tAt; snd.play().catch(() => {}); } else snd.pause(); };
  seek.oninput = () => { tAt = Number(seek.value); snd.currentTime = tAt; render(tAt); lab.textContent = tAt.toFixed(2) + 's'; };
  (function loop(now) {
    if (playing) {
      tAt = snd.duration && !snd.paused ? snd.currentTime : tAt + (now - t0) / 1000;
      if (tAt >= DUR) { tAt = 0; snd.currentTime = 0; }
      render(tAt); seek.value = tAt; lab.textContent = tAt.toFixed(2) + 's';
    }
    t0 = now;
    requestAnimationFrame(loop);
  })(performance.now());
}
boot();
</script>
</body>
</html>
