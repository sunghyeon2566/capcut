<style>

  :root {

    --card-2: #191919;
    --line: #2c2c2c;
    --fg: #ffffff;
    --muted: #b8b8b8;
    --accent: #f5c542;
    --accent-soft: #2a2208;
    --warn: #ff8a65;
    --warn-soft: #2a140d;
    --kakao: #fee500;
    --on-accent: #111111;
    --display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--body);
    font-size: 18px;
    line-height: 1.65;
    word-break: keep-all;
    overflow-wrap: anywhere;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));

  a { color: inherit; text-decoration: none; }
  button { font: inherit; }

  .wrap { max-width: 720px; margin: 0 auto; padding-block: 48px 64px; display: flex; flex-direction: column; gap: 24px; }
  .brand { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 700; color: var(--muted); font-size: 15px; letter-spacing: 0.04em; }
  .brand b { color: var(--fg); font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: 0.02em; }

  .card {
    display: block; width: 100%; text-align: left; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 24px;
    padding: 36px 24px; cursor: pointer; transition: border-color .2s, transform .2s;
  }
  .card:hover, .card:focus-visible { border-color: var(--accent); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .card:active { transform: scale(0.99); }
  .hero { padding-block: 44px; border-color: #3a3220; background: linear-gradient(160deg, #1b1607 0%, var(--card) 60%); }
  .card h1, .card h2 { font-family: var(--display); font-weight: 400; line-height: 1.25; margin: 0; text-wrap: balance; }
  .card h1 { font-size: clamp(34px, 8.4vw, 54px); }
  .card h2 { font-size: clamp(30px, 7vw, 42px); }
  .card p { margin: 14px 0 0; color: var(--muted); font-size: 19px; }

  .btn {
    margin-top: 28px; display: inline-flex; align-items: center; gap: 12px;
    padding: 16px 24px; border-radius: 999px; background: var(--accent); color: var(--on-accent);
    font-weight: 900; font-size: 19px; line-height: 1.4;
  }
  .btn.kakao { background: var(--kakao); }
  .btn svg { flex: none; width: 22px; height: 22px; transition: transform .2s; }
  .card:hover .btn svg { transform: translateX(4px); }
  .foot { text-align: center; color: var(--muted); font-size: 15px; padding-top: 8px; margin: 0; }
  .foot a { color: var(--fg); border-bottom: 1px solid var(--line); }

  /* ── 슬라이드 화면 ── */
  .deck { min-height: 100vh; display: flex; flex-direction: column; max-width: 860px; margin: 0 auto; }
  .deck-top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
    display: flex; flex-direction: column; gap: 12px; padding-block: 14px 12px;

  .deck-top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .back { background: none; border: 0; color: var(--muted); font-size: 17px; cursor: pointer; padding: 6px 0; }
  .back:hover { color: var(--fg); }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 17px; }
  .dots { display: flex; gap: 6px; }
  .dots button { flex: 1; height: 8px; border: 0; border-radius: 8px; background: var(--line); cursor: pointer; padding: 0; }
  .dots button.done { background: #7a6421; }
  .dots button.on { background: var(--accent); }

  .slide { flex: 1; padding-block: 28px 36px; display: flex; flex-direction: column; gap: 22px; }
  .step-tag { display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; color: var(--accent); font-weight: 900; font-size: 16px; letter-spacing: 0.08em; }
  .step-tag .num {
    font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: 0;
    width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
    display: grid; place-items: center;
  }
  .slide h2 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 7.4vw, 52px); line-height: 1.25; margin: 0; white-space: pre-line; text-wrap: balance; }
  .lead { margin: 0; font-size: clamp(19px, 4.4vw, 23px); color: #e8e8e8; }

  .box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .box h3 { margin: 0; font-size: 16px; font-weight: 900; color: var(--accent); letter-spacing: 0.06em; }
  .box ol, .box ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .box ol { counter-reset: s; }
  .box ol li { counter-increment: s; display: flex; gap: 12px; font-size: 19px; }
  .box ol li::before {
    content: counter(s); flex: none; width: 28px; height: 28px; margin-top: 2px; border-radius: 50%;
    border: 2px solid var(--accent); color: var(--accent); font-weight: 900; font-size: 15px; display: grid; place-items: center;
  }
  .box ul li { display: flex; gap: 12px; font-size: 19px; }
  .box ul li::before { content: ""; flex: none; width: 9px; height: 9px; margin-top: .65em; border-radius: 50%; background: var(--accent); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px;
    background: var(--card-2); border: 1px solid var(--line); font-weight: 700; font-size: 17px;
  }
  a.chip:hover { border-color: var(--accent); }
  a.chip::after { content: "↗"; color: var(--accent); }
  .file {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 17px;
  }
  .file::before { content: "📎"; }
  .result .file::before { content: "✅"; }
  .result .file { background: #0f2214; color: #8fe3a3; }

  .note { border-radius: 16px; padding: 16px 18px; font-size: 18px; display: flex; gap: 12px; }
  .note b { flex: none; }
  .note.tip { background: var(--accent-soft); color: #f7e3a6; }
  .note.warn { background: var(--warn-soft); color: #ffc7b5; }

  .prompt { background: #0b0b0b; border: 1px dashed #4a4a4a; border-radius: 18px; overflow: hidden; }
  .prompt-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px dashed #4a4a4a; }
  .prompt-head span { font-weight: 900; font-size: 17px; }
  .copy {
    flex: none; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent);
    font-weight: 900; font-size: 16px; padding: 10px 18px; cursor: pointer;
  }
  .copy.ok { background: #8fe3a3; }
  .prompt pre {
    margin: 0; padding: 16px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere;
    font-family: var(--body); font-size: 17px; line-height: 1.7; color: #dcdcdc; max-height: 340px; overflow-y: auto;

  .ui-path { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
  .ui-path span { background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
  .ui-path i { font-style: normal; color: var(--accent); }

  /* 전체 흐름 목록 */
  .flow { display: flex; flex-direction: column; gap: 10px; }
  .flow button {
    display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; color: var(--fg); cursor: pointer;
  }
  .flow button:hover { border-color: var(--accent); }
  .flow .n { font-family: var(--display); font-size: 22px; width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .flow .t { font-weight: 900; font-size: 19px; min-width: 0; }
  .flow .t small { display: block; font-weight: 500; font-size: 15px; color: var(--muted); }
  .flow .go { color: var(--accent); font-size: 20px; }
  .phase { margin: 10px 0 0; color: var(--muted); font-size: 15px; font-weight: 700; letter-spacing: 0.08em; }

  .end-links { display: flex; flex-direction: column; gap: 12px; }
  .end-links a { display: block; text-align: center; padding: 18px; border-radius: 999px; font-weight: 900; font-size: 19px; background: var(--accent); color: var(--on-accent); }
  .end-links a.kakao { background: var(--kakao); }

  .nav {
    position: sticky; bottom: 0; z-index: 5; background: var(--bg);
    display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px;
    padding-top: 12px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
  }
  .nav button { font-weight: 900; font-size: 19px; padding: 16px; border-radius: 999px; cursor: pointer; border: 1px solid #555; background: transparent; color: var(--fg); }
  .nav button.next { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .nav button:disabled { opacity: .3; cursor: default; }
  .nav button:focus-visible, .back:focus-visible, .copy:focus-visible, .flow button:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      how: [

        "그 뒤에 본문 영상을 이어 붙입니다.",
        "최종 영상을 내보냅니다."
      ],
      order: ["후킹 영상", "채널 홍보 영상", "본문 영상"],
      tip: "채널 홍보 영상은 후킹 영상이 끝난 직후에 넣어 주시면 좋습니다.",
      result: ["최종 영상"]
    }
  ];

  document.querySelectorAll("[data-link]").forEach(function (a) {
    a.href = LINKS[a.dataset.link];
    a.target = "_blank";
    a.rel = "noopener";
  });

  // ───────────────────────────────────────────────
  // 슬라이드: 0 = 전체 흐름, 1~9 = 단계, 10 = 마무리
  // ───────────────────────────────────────────────
  const TOTAL = STEPS.length + 2;
  const home = document.getElementById("home");
  const guide = document.getElementById("guide");
  const slideEl = document.getElementById("slide");
  const dotsEl = document.getElementById("dots");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  let index = 0;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function list(tag, items) {
    return "<" + tag + ">" + items.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</" + tag + ">";
  }
  function files(items) {
    return '<div class="chips">' + items.map(function (t) { return '<span class="file">' + esc(t) + "</span>"; }).join("") + "</div>";
  }
  function toolChips(keys) {
    return '<div class="chips">' + keys.map(function (k) {
      const t = TOOLS[k];
      return t.url
        ? '<a class="chip" href="' + t.url + '" target="_blank" rel="noopener">' + esc(t.name) + "</a>"
        : '<span class="chip">' + esc(t.name) + "</span>";
    }).join("") + "</div>";
  }
  function arrowRow(items) {
    return '<div class="ui-path">' + items.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("<i>→</i>") + "</div>";
  }

  function overviewHTML() {
    let html = '<span class="step-tag">한눈에 보기</span>' +
      "<h2>민담 영상,\n9단계면 완성됩니다</h2>" +
      '<p class="lead">단계를 누르면 그 설명으로 바로 이동해요. 처음이시면 [다음]을 눌러 1단계부터 차례대로 보세요.</p>' +
      '<div class="flow">';
    let lastPhase = "";
    STEPS.forEach(function (s, i) {
      if (s.phase !== lastPhase) { html += '<p class="phase">' + esc(s.phase) + "</p>"; lastPhase = s.phase; }
      html += '<button type="button" data-jump="' + (i + 1) + '"><span class="n">' + (i + 1) + '</span><span class="t">' +
        esc(s.title) + "<small>" + esc(s.short) + '</small></span><span class="go">›</span></button>';
    });
    return html + "</div>";
  }

  function stepHTML(i) {
    const s = STEPS[i];
    let html = '<span class="step-tag"><span class="num">' + (i + 1) + "</span>STEP " + (i + 1) + " / " + STEPS.length + "</span>" +
      "<h2>" + esc(s.title) + "</h2>" +
      '<p class="lead">' + esc(s.lead) + "</p>";

    const side = [];
    if (s.tools) side.push('<div class="box"><h3>사용하는 프로그램</h3>' + toolChips(s.tools) + "</div>");
    if (s.attach) side.push('<div class="box"><h3>준비할 파일</h3>' + files(s.attach) + "</div>");
    if (side.length) html += '<div class="grid2">' + side.join("") + "</div>";

    if (s.warn) html += '<div class="note warn"><b>⚠️ 꼭!</b><span>' + esc(s.warn) + "</span></div>";
    html += '<div class="box"><h3>따라 하기</h3>' + list("ol", s.how) + "</div>";
    if (s.path) html += '<div class="box"><h3>설정 순서</h3>' + arrowRow(s.path) + "</div>";
    if (s.order) html += '<div class="box"><h3>이어 붙이는 순서</h3>' + arrowRow(s.order) + "</div>";
    if (s.prompt) {
      html += '<div class="prompt"><div class="prompt-head"><span>' + esc(s.prompt.title) +
        '</span><button type="button" class="copy" data-copy="' + i + '">복사하기</button></div><pre id="prompt-' + i + '">' +
        esc(s.prompt.text) + "</pre></div>";
    }
    if (s.tip) html += '<div class="note tip"><b>💡 도움말</b><span>' + esc(s.tip) + "</span></div>";
    html += '<div class="box result"><h3>이 단계가 끝나면 생기는 것</h3>' + files(s.result) + "</div>";
    return html;
  }

  function endHTML() {
    return '<span class="step-tag">수고하셨습니다</span>' +
      "<h2>민담 영상 한 편이\n완성되었습니다</h2>" +
      '<p class="lead">처음에는 시간이 걸려도 두세 번 반복하면 금방 손에 익어요. 막히는 단계가 있으면 강의와 단톡방에서 함께 해결해요.</p>' +
      '<div class="end-links">' +
      '<a href="' + LINKS.lectureForm + '" target="_blank" rel="noopener">민담 유튜브 강의 신청서 작성</a>' +
      '<a class="kakao" href="' + LINKS.kakaoOpenChat + '" target="_blank" rel="noopener">딥마크온 클래스 단톡방 입장</a>' +
      "</div>";
  }

  function render() {
    if (index === 0) slideEl.innerHTML = overviewHTML();
    else if (index === TOTAL - 1) slideEl.innerHTML = endHTML();
    else slideEl.innerHTML = stepHTML(index - 1);

    document.getElementById("count").textContent =
      index === 0 ? "전체 흐름" : index === TOTAL - 1 ? "완성" : index + " / " + STEPS.length + " 단계";
    dotsEl.innerHTML = "";
    for (let d = 0; d < TOTAL; d++) {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", d === 0 ? "전체 흐름" : d === TOTAL - 1 ? "완성" : d + "단계");
      if (d < index) b.className = "done";
      if (d === index) b.className = "on";
      b.addEventListener("click", function () { go(d); });
      dotsEl.appendChild(b);
    }
    prev.disabled = index === 0;
    next.textContent = index === TOTAL - 1 ? "처음 화면으로" : index === 0 ? "1단계부터 시작 →" : "다음 →";
  }

  function go(i) { index = Math.min(Math.max(i, 0), TOTAL - 1); render(); window.scrollTo(0, 0); }
  function showGuide() { home.hidden = true; guide.hidden = false; go(0); }
  function showHome() { guide.hidden = true; home.hidden = false; window.scrollTo(0, 0); }

  slideEl.addEventListener("click", function (e) {
    const jump = e.target.closest("[data-jump]");
    if (jump) { go(Number(jump.dataset.jump)); return; }
    const btn = e.target.closest("[data-copy]");
    if (!btn) return;
    const text = STEPS[Number(btn.dataset.copy)].prompt.text;
    function done() { btn.textContent = "복사됨 ✓"; btn.classList.add("ok"); setTimeout(function () { btn.textContent = "복사하기"; btn.classList.remove("ok"); }, 2000); }
    function fallback() {
      const pre = document.getElementById("prompt-" + btn.dataset.copy);
      const r = document.createRange(); r.selectNodeContents(pre);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      btn.textContent = "선택됨 · 길게 눌러 복사";
    }
    try {
      navigator.clipboard.writeText(text).then(done, fallback);
    } catch (err) { fallback(); }
  });

  document.getElementById("open-guide").addEventListener("click", showGuide);
  document.getElementById("close-guide").addEventListener("click", showHome);
  prev.addEventListener("click", function () { go(index - 1); });
  next.addEventListener("click", function () { if (index === TOTAL - 1) showHome(); else go(index + 1); });

  document.addEventListener("keydown", function (e) {
    if (guide.hidden) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") go(index + 1);
    if (e.key === "ArrowLeft" || e.key === "PageUp") go(index - 1);
    if (e.key === "Escape") showHome();
  });

  // 링크 끝에 #guide 를 붙이면 슬라이드 화면부터 열립니다
  if (location.hash === "#guide") showGuide();
</script>
